<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MORNINGSTAR EXCHANGE - Mache P2P</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{font-family:'Inter',-apple-system,Roboto,Arial,sans-serif;background:#090a0f;background-image:radial-gradient(circle at 10% 0%,rgba(212,175,55,.09),transparent 45%);min-height:100vh;color:#e5e7eb;padding-bottom:3rem;font-variant-numeric:tabular-nums}
.gold-text{background:linear-gradient(135deg,#FFF099,#F1C40F 35%,#D4AF37 70%,#996515);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.gold-btn{background:linear-gradient(135deg,#FFD700,#D4AF37 50%,#B8860B);color:#000;font-weight:700}
.gold-btn:disabled{opacity:.45}
.panel{background:rgba(18,20,29,.78);border:1px solid rgba(255,255,255,.07)}
.tab{font-size:.78rem;font-weight:600;padding:.55rem 0;color:#9ca3af;border-bottom:2px solid transparent}
.tab.on{color:#F1C40F;border-color:#D4AF37}
.seg button{flex:1;padding:.55rem;font-size:.82rem;font-weight:700;color:#9ca3af;border-radius:.7rem}
.seg button.on{background:#D4AF37;color:#000}
.field{display:flex;align-items:center;gap:.5rem;background:rgba(10,11,16,.9);border:1px solid rgba(255,255,255,.14);border-radius:.8rem;padding:0 .8rem}
.field:focus-within{border-color:#D4AF37;box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.field input,.field select,.field textarea{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:.7rem 0;font-size:.9rem}
.field select option{background:#12141d}
.field span{color:#9ca3af;font-size:.78rem;font-weight:600}
.lbl{display:block;font-size:.72rem;color:#d1d5db;font-weight:500;margin:.7rem 0 .3rem}
.pill{font-size:.65rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;white-space:nowrap}
.chip{font-size:.65rem;padding:.12rem .5rem;border-radius:999px;border:1px solid rgba(255,255,255,.12);color:#9ca3af}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.75)}
.modal.hidden{display:none}
.sheet{width:100%;max-width:30rem;max-height:94vh;overflow-y:auto;background:#12141d;border:1px solid rgba(212,175,55,.2);border-radius:1.5rem 1.5rem 0 0;padding:1rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:1.5rem}}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.85rem}
.row:last-child{border:0}.row>span:first-child{color:#9ca3af;flex-shrink:0}.row>span:last-child{text-align:right;word-break:break-word}
.bub{max-width:82%;padding:.45rem .7rem;border-radius:.9rem;font-size:.82rem;word-break:break-word}
.bub.me{background:rgba(212,175,55,.18);margin-left:auto;border-bottom-right-radius:.25rem}
.bub.them{background:rgba(255,255,255,.07);border-bottom-left-radius:.25rem}
.bub.sys{background:transparent;color:#9ca3af;font-size:.72rem;text-align:center;max-width:100%;margin:0 auto}
#toast{position:fixed;top:.75rem;left:.75rem;right:.75rem;max-width:30rem;margin:auto;z-index:90;transition:all .25s}
#toast.hidden{display:block;opacity:0;transform:translateY(-12px);pointer-events:none}
</style>
</head>
<body>
<div id="toast" class="hidden px-4 py-3 rounded-xl text-sm font-medium border"></div>
<div class="max-w-md mx-auto px-4 pt-4">
  <header class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-3">
      <a href="/dashboard.html" class="panel w-9 h-9 rounded-full flex items-center justify-center text-gray-300 text-sm" aria-label="Retounen"><i class="fa-solid fa-arrow-left"></i></a>
      <h1 class="text-lg font-bold gold-text">Mache P2P</h1>
    </div>
    <button onclick="go('wallet')" class="panel rounded-full px-3 py-1.5 text-xs font-semibold"><i class="fa-solid fa-wallet text-amber-400 mr-1"></i><span id="chip">—</span> USDT</button>
  </header>

  <nav class="grid grid-cols-4 border-b border-white/10 mb-4">
    <button class="tab on" data-v="market" onclick="go('market')">Mache</button>
    <button class="tab" data-v="orders" onclick="go('orders')">Lòd mwen</button>
    <button class="tab" data-v="ads" onclick="go('ads')">Anons mwen</button>
    <button class="tab" data-v="wallet" onclick="go('wallet')">Pòtfèy</button>
  </nav>
  <div id="gate" class="hidden mb-4 px-3.5 py-3 rounded-xl border border-amber-500/40 bg-amber-950/40 text-amber-200 text-xs"></div>
  <main id="view"></main>
</div>

<!-- Fenèt jenerik (fòm lòd, anons) -->
<div id="m-sheet" class="modal hidden" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<!-- Paj lòd -->
<div id="m-order" class="modal hidden" onclick="if(event.target===this)closeOrder()"><div class="sheet" id="order"></div></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FIATS = { HTG: ['MonCash', 'NatCash'], USD: ['Zelle', 'CashApp', 'PayPal', 'Meru', 'Wise'] };
const ST = {
  WAITING_PAYMENT: ['Ap tann peman', 'bg-amber-500/15 text-amber-400'], PAYMENT_MARKED: ['Peman make', 'bg-sky-500/15 text-sky-300'],
  COMPLETED: ['Fini', 'bg-emerald-500/15 text-emerald-400'], CANCELLED: ['Anile', 'bg-white/10 text-gray-400'], EXPIRED: ['Ekspire', 'bg-white/10 text-gray-400'],
  DISPUTED: ['Dispit', 'bg-red-500/15 text-red-400'], UNDER_REVIEW: ['Dispit an revizyon', 'bg-red-500/15 text-red-400'], CREATED: ['Kreye', 'bg-white/10 text-gray-400'], ESCROW_LOCKED: ['Escrow bloke', 'bg-amber-500/15 text-amber-400']
};
const pill = (s) => { const [l, c] = ST[s] || [s, '']; return `<span class="pill ${c}">${l}</span>`; };
let ADS = [], me = null, view = 'market', side = 'BUY', fiat = 'HTG', openId = null, pollT = null, lastMsg = 0;
const KEYS = {};
const key = (n) => (KEYS[n] ||= crypto.randomUUID());

let tt;
function toast(msg, ok) {
  const m = $('toast');
  m.className = 'px-4 py-3 rounded-xl text-sm font-medium border ' + (ok ? 'bg-emerald-950 border-emerald-500/40 text-emerald-300' : 'bg-red-950 border-red-500/40 text-red-300');
  m.textContent = msg; clearTimeout(tt); tt = setTimeout(() => m.classList.add('hidden'), 4500);
}
async function api(method, url, body, idem) {
  const h = { 'Content-Type': 'application/json' }; if (idem) h['Idempotency-Key'] = idem;
  const r = await fetch(url, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = '/'; throw new Error('401'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Erè. Eseye ankò.'); e.code = d.code; throw e; }
  return d;
}
const act = async (fn) => { try { return await fn(); } catch (e) { if (e.message !== '401') toast(e.message, false); } };
async function copy(t) { try { await navigator.clipboard.writeText(t); } catch { const i = document.createElement('input'); i.value = t; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); } toast('Kopye!', true); }
const fdt = (ms) => new Date(ms).toLocaleString([], { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const num = (s, d = 2) => Number(s).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
// previzyalizasyon san float (sèvè a se otorite a)
function fiatPreview(cryptoStr, priceStr) {
  if (!/^\d{1,12}(\.\d{1,6})?$/.test(cryptoStr) || !/^\d{1,12}(\.\d{1,2})?$/.test(priceStr)) return null;
  const [i, f = ''] = cryptoStr.split('.'), [pi, pf = ''] = priceStr.split('.');
  const v = (BigInt(i + f.padEnd(6, '0')) * BigInt(pi + pf.padEnd(2, '0')) + 500000n) / 1000000n;
  const s = String(v).padStart(3, '0'); return s.slice(0, -2) + '.' + s.slice(-2);
}

function go(v) { view = v; document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); render(); }
async function refreshChip() { try { const w = await api('GET', '/api/p2p/wallet'); $('chip').textContent = num(w.availableStr, 2); return w; } catch { } }
function render() { ({ market: vMarket, orders: vOrders, ads: vAds, wallet: vWallet })[view](); refreshChip(); }

/* ---------- Mache ---------- */
async function vMarket() {
  const methods = FIATS[fiat];
  $('view').innerHTML = `<div class="seg panel rounded-xl p-1 flex mb-3"><button class="${side === 'BUY' ? 'on' : ''}" onclick="side='BUY';vMarket()">Achte USDT</button><button class="${side === 'SELL' ? 'on' : ''}" onclick="side='SELL';vMarket()">Vann USDT</button></div>
    <div class="grid grid-cols-3 gap-2 mb-3">
      <div class="field"><select id="f-fiat" onchange="fiat=this.value;vMarket()">${Object.keys(FIATS).map((f) => `<option ${f === fiat ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
      <div class="field"><select id="f-method" onchange="loadAds()"><option value="">Tout metòd</option>${methods.map((m) => `<option>${m}</option>`).join('')}</select></div>
      <div class="field"><input id="f-amt" type="number" inputmode="decimal" placeholder="Montan ${fiat}" onchange="loadAds()"></div></div>
    <div id="ads" class="space-y-3"><p class="text-center text-gray-500 text-sm py-8"><i class="fa-solid fa-circle-notch fa-spin"></i></p></div>`;
  loadAds();
}
async function loadAds() {
  const q = new URLSearchParams({ type: side === 'BUY' ? 'SELL' : 'BUY', fiat, method: $('f-method').value, amount: $('f-amt').value });
  const ads = await act(() => api('GET', '/api/p2p/ads?' + q));
  if (!ads) return;
  ADS = ads;
  $('ads').innerHTML = ads.length ? ads.map((a) => `<div class="panel rounded-2xl p-4">
    <div class="flex justify-between items-start mb-2"><div><p class="text-sm font-semibold">${esc(a.advertiser)}</p>
      <p class="text-[11px] text-gray-500">${a.completedOrders} lòd · ${a.completionRate == null ? 'Nouvo' : a.completionRate + '% fini'}</p></div>
      <p class="text-lg font-bold gold-text">${num(a.price)} <span class="text-xs">${a.fiat}</span></p></div>
    <div class="text-xs text-gray-400 space-y-0.5 mb-2"><p>Disponib: <b class="text-gray-200">${num(a.available, 2)} USDT</b></p><p>Limit: <b class="text-gray-200">${num(a.minFiat)} – ${num(a.maxFiat)} ${a.fiat}</b></p><p>Delè peman: ${a.payWindowMin} min</p></div>
    <div class="flex flex-wrap gap-1 mb-3">${a.methods.map((m) => `<span class="chip">${esc(m)}</span>`).join('')}</div>
    <button onclick="openTrade('${a.id}')" class="gold-btn w-full py-2.5 rounded-xl text-sm">${side === 'BUY' ? 'Achte' : 'Vann'} USDT</button></div>`).join('')
    : '<p class="text-center text-gray-500 text-sm py-10">Pa gen anons ki koresponn.</p>';
}
function openTrade(id) {
  const a = ADS.find((x) => x.id === id); if (!a) return;
  KEYS.order = null;
  const buying = a.type === 'SELL';
  $('sheet').innerHTML = `<div class="flex justify-between items-center mb-2"><h2 class="font-bold">${buying ? 'Achte' : 'Vann'} USDT</h2><button onclick="closeSheet()" class="text-gray-400 text-2xl leading-none">&times;</button></div>
    <p class="text-xs text-gray-400 mb-1">${esc(a.advertiser)} · <b class="text-gray-200">${num(a.price)} ${a.fiat}</b> / USDT</p>
    ${a.terms ? `<p class="text-[11px] text-gray-500 mb-2">${esc(a.terms)}</p>` : ''}
    <label class="lbl">Kantite USDT (disponib ${num(a.available, 2)})</label>
    <div class="field"><span>USDT</span><input id="t-amt" type="number" inputmode="decimal" step="0.000001" oninput="tPrev(${a.priceCents})" placeholder="0.00"></div>
    <p class="text-xs mt-1 text-gray-300">${buying ? 'Ou pral peye' : 'Ou pral resevwa'}: <b id="t-fiat">0.00</b> ${a.fiat} <span class="text-gray-500">(limit ${num(a.minFiat)}–${num(a.maxFiat)})</span></p>
    <label class="lbl">Metòd peman</label>
    <div class="field"><select id="t-method">${a.methods.map((m) => `<option>${esc(m)}</option>`).join('')}</select></div>
    ${buying ? '' : `<label class="lbl">Kont kote ou vle resevwa lajan an</label><div class="field"><input id="t-acc" maxlength="100" placeholder="Nimewo / imèl / kont"></div>
      <label class="lbl">Non sou kont lan</label><div class="field"><input id="t-name" maxlength="80"></div>
      <p class="text-[11px] text-amber-300 mt-2">USDT ou a ap bloke an escrow touswit. Li lage sèlman lè ou konfime ke lajan an antre.</p>`}
    <p id="t-err" class="text-red-400 text-xs mt-2 hidden"></p>
    <button id="t-go" onclick="doTrade('${a.id}')" class="gold-btn w-full py-3 rounded-xl text-sm mt-4">Konfime lòd</button>`;
  $('m-sheet').classList.remove('hidden');
}
function tPrev(pc) { const v = fiatPreview($('t-amt').value, (pc / 100).toFixed(2)); $('t-fiat').textContent = v ? num(v) : '0.00'; }
async function doTrade(adId) {
  const err = (m) => { $('t-err').textContent = m; $('t-err').classList.remove('hidden'); };
  const body = { adId, crypto: $('t-amt').value.trim(), method: $('t-method').value };
  if ($('t-acc')) body.payDetails = { account: $('t-acc').value, name: $('t-name').value };
  $('t-go').disabled = true;
  try {
    const o = await api('POST', '/api/p2p/orders', body, key('order'));
    delete KEYS.order; closeSheet(); toast('Lòd kreye.', true); openOrder(o.id);
  } catch (e) { if (e.code) delete KEYS.order; err(e.message); $('t-go').disabled = false; }
}
const closeSheet = () => $('m-sheet').classList.add('hidden');

/* ---------- Lòd mwen ---------- */
async function vOrders() {
  $('view').innerHTML = '<div id="olist" class="space-y-2"><p class="text-center text-gray-500 py-8"><i class="fa-solid fa-circle-notch fa-spin"></i></p></div>';
  const os = await act(() => api('GET', '/api/p2p/orders')); if (!os) return;
  $('olist').innerHTML = os.length ? os.map((o) => `<button onclick="openOrder('${o.id}')" class="panel rounded-2xl p-3.5 w-full text-left flex justify-between gap-2">
    <div class="min-w-0"><p class="text-sm font-semibold">${o.role === 'BUYER' ? 'Achte' : 'Vann'} ${num(o.crypto, 2)} USDT</p>
    <p class="text-[11px] text-gray-500">${esc(o.role === 'BUYER' ? o.seller : o.buyer)} · ${fdt(o.createdAt)}</p></div>
    <div class="text-right flex-shrink-0"><p class="text-sm font-semibold">${num(o.fiatAmount)} ${o.fiat}</p>${pill(o.status)}</div></button>`).join('')
    : '<p class="text-center text-gray-500 text-sm py-10">Ou poko gen lòd.</p>';
}

/* ---------- Paj lòd ---------- */
async function openOrder(id) {
  openId = id; lastMsg = 0; $('order').innerHTML = '<p class="text-center py-10 text-gray-400"><i class="fa-solid fa-circle-notch fa-spin"></i></p>';
  $('m-order').classList.remove('hidden');
  await loadOrder(true); clearInterval(pollT); pollT = setInterval(() => loadOrder(false), 5000);
}
function closeOrder() { $('m-order').classList.add('hidden'); clearInterval(pollT); openId = null; if (view === 'orders') vOrders(); refreshChip(); }
async function loadOrder(full) {
  if (!openId) return;
  let o; try { o = await api('GET', '/api/p2p/orders/' + openId); } catch (e) { return; }
  const sig = [o.status, o.actions.join(), o.evidence.length, o.dispute ? o.dispute.status : ''].join('|');
  if (full || sig !== window.__sig) { window.__sig = sig; lastMsg = 0; drawOrder(o); }
  const msgs = await api('GET', `/api/p2p/orders/${openId}/messages?after=${lastMsg}`).catch(() => []);
  appendMsgs(msgs);
}
function statusBlock(o) {
  const msg = { WAITING_PAYMENT: o.role === 'BUYER' ? 'Voye peman an anvan delè a fini.' : 'N ap tann achtè a peye. USDT ou an escrow.', PAYMENT_MARKED: o.role === 'SELLER' ? 'Achtè a di li peye. Verifye ke lajan an antre sou kont ou anvan ou lage.' : 'N ap tann vandè a konfime resepsyon an.',
    COMPLETED: 'Lòd fini. USDT lage bay achtè a.', CANCELLED: 'Lòd anile. USDT tounen bay vandè a.', EXPIRED: 'Delè peman an fini. USDT tounen bay vandè a.',
    DISPUTED: 'Dispit louvri. Escrow bloke jiskaske yon admin deside.', UNDER_REVIEW: 'Yon admin ap revize dispit la. Escrow bloke.' }[o.status] || '';
  const t = o.status === 'WAITING_PAYMENT' ? o.expiresAt : o.status === 'PAYMENT_MARKED' ? o.sellerDeadline : 0;
  return `<div class="flex items-center justify-between mb-1">${pill(o.status)}${t ? `<span class="text-xs text-amber-300"><i class="fa-regular fa-clock mr-1"></i><span id="cd" data-until="${t}"></span></span>` : ''}</div><p class="text-xs text-gray-300">${msg}</p>`;
}
function drawOrder(o) {
  const buyer = o.role === 'BUYER', has = (a) => o.actions.includes(a);
  const pay = o.sellerPay;
  const payCard = buyer && o.status === 'WAITING_PAYMENT' ? `<div class="panel rounded-xl p-3 mt-3"><p class="text-xs font-semibold text-amber-300 mb-1">Voye ${num(o.fiatAmount)} ${o.fiat} sou ${esc(o.method)}</p>
    <div class="row"><span>Kont</span><span>${esc(pay.account)} <button data-c="${esc(pay.account)}" onclick="copy(this.dataset.c)" class="text-amber-400 ml-1"><i class="fa-regular fa-copy"></i></button></span></div>
    <div class="row"><span>Non</span><span>${esc(pay.name)}</span></div>
    <div class="row"><span>Montan egzat</span><span>${num(o.fiatAmount)} ${o.fiat} <button onclick="copy('${o.fiatAmount}')" class="text-amber-400 ml-1"><i class="fa-regular fa-copy"></i></button></span></div>
    <div class="row"><span>Referans pou mete</span><span><b>${esc(o.payRef)}</b> <button onclick="copy('${esc(o.payRef)}')" class="text-amber-400 ml-1"><i class="fa-regular fa-copy"></i></button></span></div></div>` : '';
  const sellerInfo = !buyer && ['WAITING_PAYMENT', 'PAYMENT_MARKED'].includes(o.status) ? `<div class="panel rounded-xl p-3 mt-3 text-xs"><p class="text-gray-400">Lajan an dwe antre sou: <b class="text-gray-200">${esc(pay.account)}</b> (${esc(pay.name)})</p><p class="text-gray-400 mt-1">Montan: <b class="text-gray-200">${num(o.fiatAmount)} ${o.fiat}</b> · Referans: <b class="text-gray-200">${esc(o.payRef)}</b></p>
    ${o.paymentNote ? `<p class="text-gray-400 mt-1">Referans achtè a: <b class="text-gray-200">${esc(o.paymentNote)}</b></p>` : ''}${o.providerVerified ? '<p class="text-emerald-400 mt-1"><i class="fa-solid fa-circle-check mr-1"></i>Peman verifye pa pwovizè a</p>' : ''}</div>` : '';
  const pinF = me.pinActive ? `<div class="field mt-2"><span>PIN</span><input id="o-pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"></div>` : '';
  const actions = `
    ${has('PAY') ? `<label class="lbl">Referans peman (ID tranzaksyon / non moun ki voye a)</label><div class="field"><input id="o-ref" maxlength="120" placeholder="Egz: ID tranzaksyon"></div>
      <label class="lbl">Foto prèv peman (opsyonèl)</label><input id="o-file" type="file" accept="image/jpeg,image/png,image/webp" class="text-xs text-gray-400">
      <div class="grid grid-cols-2 gap-2 mt-3"><button onclick="doPaid()" class="gold-btn py-3 rounded-xl text-sm">Mwen peye</button><button onclick="doCancel()" class="py-3 rounded-xl text-sm border border-white/10 text-gray-300">Anile lòd</button></div>` : ''}
    ${has('RELEASE') ? `${pinF}<button onclick="doRelease()" class="gold-btn w-full py-3 rounded-xl text-sm mt-3"><i class="fa-solid fa-lock-open mr-1"></i>Mwen resevwa lajan an — lage USDT</button>
      <p class="text-[11px] text-amber-300 mt-1">Lage sèlman si lajan an reyèlman sou kont ou. Pa fè sa sou yon foto oswa mesaj.</p>` : ''}
    ${has('DISPUTE') || has('LATE_CLAIM') ? `<button onclick="showDispute()" class="w-full py-2.5 rounded-xl text-xs border border-red-500/40 text-red-300 mt-3">${has('LATE_CLAIM') ? 'Mwen te peye an reta — louvri reklamasyon' : 'Louvri yon dispit'}</button><div id="dform"></div>` : ''}
    ${['DISPUTED', 'UNDER_REVIEW'].includes(o.status) && o.dispute ? `<div class="panel rounded-xl p-3 mt-3 text-xs"><p class="font-semibold text-red-300 mb-1">Dispit</p><p class="text-gray-300">${esc(o.dispute.reason)}</p>
      <label class="lbl">Ajoute prèv (foto)</label><input id="o-dfile" type="file" accept="image/jpeg,image/png,image/webp" class="text-xs text-gray-400" onchange="upEv('o-dfile','DISPUTE')"></div>` : ''}
    ${o.dispute && o.dispute.status === 'RESOLVED' ? `<div class="panel rounded-xl p-3 mt-3 text-xs"><p class="font-semibold text-emerald-300">Dispit rezoud: ${o.dispute.resolution === 'RELEASE_TO_BUYER' ? 'USDT lage bay achtè a' : 'USDT tounen bay vandè a'}</p><p class="text-gray-400 mt-1">${esc(o.dispute.resolution_reason)}</p></div>` : ''}`;
  const ev = o.evidence.length ? `<p class="text-xs font-semibold mt-4 mb-1">Prèv</p><div class="flex gap-2 flex-wrap">${o.evidence.map((e) => `<a href="/api/p2p/evidence/${e.id}" target="_blank" class="block"><img src="/api/p2p/evidence/${e.id}" class="w-16 h-16 object-cover rounded-lg border border-white/10" alt=""><span class="text-[10px] text-gray-500">${e.by === 'BUYER' ? 'Achtè' : 'Vandè'}</span></a>`).join('')}</div>` : '';
  const tl = `<details class="mt-4 text-xs text-gray-400"><summary class="cursor-pointer">Istwa lòd la</summary><div class="mt-2 space-y-1">${o.events.map((e) => `<p>${fdt(e.ts)} · ${esc(e.action)}${e.to_status ? ' → ' + e.to_status : ''}</p>`).join('')}</div></details>`;
  $('order').innerHTML = `<div class="flex justify-between items-center mb-2"><h2 class="font-bold">${buyer ? 'Achte' : 'Vann'} ${num(o.crypto, 2)} USDT</h2><button onclick="closeOrder()" class="text-gray-400 text-2xl leading-none">&times;</button></div>
    <div id="ostatus">${statusBlock(o)}</div>
    <div class="panel rounded-xl px-3 mt-3"><div class="row"><span>Montan</span><span>${num(o.fiatAmount)} ${o.fiat}</span></div><div class="row"><span>Pri</span><span>${num(o.price)} ${o.fiat} / USDT</span></div>
    <div class="row"><span>${buyer ? 'Vandè' : 'Achtè'}</span><span>${esc(buyer ? o.seller : o.buyer)}</span></div><div class="row"><span>Metòd</span><span>${esc(o.method)}</span></div>
    <div class="row"><span>Escrow</span><span>${o.escrow || '—'}</span></div></div>
    ${payCard}${sellerInfo}${actions}${ev}${tl}
    <p class="text-xs font-semibold mt-4 mb-1">Chat</p><div id="chat" class="space-y-1.5 max-h-56 overflow-y-auto mb-2"></div>
    <div class="field"><input id="o-msg" maxlength="1000" placeholder="Ekri yon mesaj..." onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()" class="text-amber-400"><i class="fa-solid fa-paper-plane"></i></button></div>
    <button onclick="reportOrder()" class="text-[11px] text-gray-500 underline mt-3">Siyale yon pwoblèm bay ekip la</button>`;
  tick();
}
function appendMsgs(ms) {
  const c = $('chat'); if (!c || !ms.length) return;
  ms.forEach((m) => { lastMsg = Math.max(lastMsg, m.id); const cls = m.role === 'SYSTEM' ? 'sys' : m.mine ? 'me' : 'them';
    const who = m.role === 'STAFF' ? '<b class="text-red-300">Sipò</b> · ' : '';
    c.insertAdjacentHTML('beforeend', `<div class="bub ${cls}">${who}${esc(m.body)}</div>`); });
  c.scrollTop = c.scrollHeight;
}
async function sendMsg() { const i = $('o-msg'), t = i.value.trim(); if (!t) return; i.value = ''; await act(() => api('POST', `/api/p2p/orders/${openId}/messages`, { body: t })); loadOrder(false); }
async function upload(inputId, kind) {
  const f = $(inputId) && $(inputId).files[0]; if (!f) return null;
  const fd = new FormData(); fd.append('file', f); fd.append('kind', kind);
  const r = await fetch(`/api/p2p/orders/${openId}/evidence`, { method: 'POST', body: fd });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Pwoblèm ak foto a.'); return d;
}
async function upEv(id, kind) { await act(async () => { await upload(id, kind); toast('Prèv voye.', true); loadOrder(true); }); }
async function doPaid() {
  await act(async () => {
    const ref = $('o-ref').value.trim();
    if (ref.length < 3) throw new Error('Antre referans peman an.');
    await upload('o-file', 'PAYMENT_PROOF');
    await api('POST', `/api/p2p/orders/${openId}/paid`, { reference: ref });
    toast('Peman make. Vandè a ap verifye.', true); loadOrder(true);
  });
}
async function doCancel() { if (!confirm('Anile lòd sa a? Ou pa dwe anile si ou deja peye.')) return; await act(async () => { await api('POST', `/api/p2p/orders/${openId}/cancel`); toast('Lòd anile.', true); loadOrder(true); }); }
async function doRelease() {
  if (!confirm('Konfime ke lajan an antre sou kont ou? Aksyon sa a pa ka defèt.')) return;
  await act(async () => { await api('POST', `/api/p2p/orders/${openId}/release`, me.pinActive ? { pin: $('o-pin').value } : {}); toast('USDT lage bay achtè a.', true); refreshChip(); loadOrder(true); });
}
function showDispute() {
  $('dform').innerHTML = `<label class="lbl">Eksplike pwoblèm lan (10–500 karaktè)</label><div class="field"><textarea id="d-reason" rows="3" maxlength="500"></textarea></div>
    <label class="lbl">Prèv (foto, opsyonèl)</label><input id="d-file" type="file" accept="image/jpeg,image/png,image/webp" class="text-xs text-gray-400">
    <button onclick="doDispute()" class="w-full py-2.5 rounded-xl text-sm bg-red-600 text-white mt-3">Voye dispit la</button>`;
}
async function doDispute() {
  await act(async () => {
    await api('POST', `/api/p2p/orders/${openId}/dispute`, { reason: $('d-reason').value });
    try { await upload('d-file', 'DISPUTE'); } catch (e) { toast(e.message, false); }
    toast('Dispit louvri. Escrow bloke.', true); loadOrder(true);
  });
}
async function reportOrder() { const r = prompt('Dekri pwoblèm lan (omwen 10 karaktè):'); if (!r) return; await act(async () => { await api('POST', '/api/p2p/reports', { targetType: 'ORDER', targetId: openId, reason: r }); toast('Rapò voye.', true); }); }
function tick() {
  const el = $('cd'); if (!el) return;
  const left = Math.max(0, Math.floor((Number(el.dataset.until) - Date.now()) / 1000));
  el.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
}
setInterval(tick, 1000);

/* ---------- Anons mwen ---------- */
async function vAds() {
  $('view').innerHTML = `<button onclick="openAdForm()" class="gold-btn w-full py-3 rounded-xl text-sm mb-3"><i class="fa-solid fa-plus mr-1"></i>Kreye yon anons</button><div id="alist" class="space-y-2"></div>`;
  const ads = await act(() => api('GET', '/api/p2p/my-ads')); if (!ads) return;
  $('alist').innerHTML = ads.length ? ads.map((a) => `<div class="panel rounded-2xl p-3.5"><div class="flex justify-between"><p class="text-sm font-semibold">${a.type === 'SELL' ? 'Vann' : 'Achte'} USDT · ${num(a.price)} ${a.fiat}</p><span class="pill ${a.status === 'ACTIVE' ? 'bg-emerald-500/15 text-emerald-400' : 'bg-white/10 text-gray-400'}">${a.status}</span></div>
    <p class="text-[11px] text-gray-500 mt-1">Rete ${num(a.available, 2)} USDT · ${num(a.minFiat)}–${num(a.maxFiat)} ${a.fiat} · ${a.methods.map(esc).join(', ')}</p>
    ${['ACTIVE', 'PAUSED'].includes(a.status) ? `<div class="flex gap-2 mt-2"><button onclick="adStatus('${a.id}','${a.status === 'ACTIVE' ? 'PAUSED' : 'ACTIVE'}')" class="chip">${a.status === 'ACTIVE' ? 'Poze' : 'Aktive'}</button><button onclick="adStatus('${a.id}','CLOSED')" class="chip text-red-300">Fèmen</button></div>` : ''}</div>`).join('')
    : '<p class="text-center text-gray-500 text-sm py-8">Ou poko gen anons.</p>';
}
async function adStatus(id, s) { await act(async () => { await api('POST', `/api/p2p/ads/${id}/status`, { status: s }); vAds(); }); }
function openAdForm() {
  KEYS.ad = null;
  $('sheet').innerHTML = `<div class="flex justify-between items-center mb-2"><h2 class="font-bold">Nouvo anons</h2><button onclick="closeSheet()" class="text-gray-400 text-2xl leading-none">&times;</button></div>
    <div class="seg panel rounded-xl p-1 flex"><button id="a-sell" class="on" onclick="adType('SELL')">Mwen vann USDT</button><button id="a-buy" onclick="adType('BUY')">Mwen achte USDT</button></div>
    <label class="lbl">Lajan fiat</label><div class="field"><select id="a-fiat" onchange="adFiat()">${Object.keys(FIATS).map((f) => `<option>${f}</option>`).join('')}</select></div>
    <div class="grid grid-cols-2 gap-2"><div><label class="lbl">Pri (1 USDT)</label><div class="field"><input id="a-price" type="number" inputmode="decimal" step="0.01"></div></div>
      <div><label class="lbl">Total USDT</label><div class="field"><input id="a-total" type="number" inputmode="decimal" step="0.000001"></div></div>
      <div><label class="lbl">Minimòm (fiat)</label><div class="field"><input id="a-min" type="number" inputmode="decimal" step="0.01"></div></div>
      <div><label class="lbl">Maksimòm (fiat)</label><div class="field"><input id="a-max" type="number" inputmode="decimal" step="0.01"></div></div></div>
    <label class="lbl">Metòd peman</label><div id="a-methods" class="flex flex-wrap gap-2"></div><div id="a-pay"></div>
    <label class="lbl">Delè peman (5–60 min)</label><div class="field"><input id="a-win" type="number" value="15" min="5" max="60"></div>
    <label class="lbl">Kondisyon (opsyonèl)</label><div class="field"><input id="a-terms" maxlength="300"></div>
    <p id="a-note" class="text-[11px] text-amber-300 mt-2"></p><p id="a-err" class="text-red-400 text-xs mt-2 hidden"></p>
    <button id="a-go" onclick="doAd()" class="gold-btn w-full py-3 rounded-xl text-sm mt-4">Piblye anons lan</button>`;
  window.adT = 'SELL'; adFiat(); $('m-sheet').classList.remove('hidden');
}
function adType(t) { window.adT = t; $('a-sell').classList.toggle('on', t === 'SELL'); $('a-buy').classList.toggle('on', t === 'BUY'); adFiat(); }
function adFiat() {
  const f = $('a-fiat').value;
  $('a-methods').innerHTML = FIATS[f].map((m) => `<label class="chip flex items-center gap-1"><input type="checkbox" value="${m}" onchange="adPay()"> ${m}</label>`).join('');
  $('a-note').textContent = adT === 'SELL' ? 'USDT ou a pa bloke kounye a: li bloke an escrow sèlman lè yon achtè kreye yon lòd.' : 'Lè yon vandè pran anons lan, li ap bloke USDT li an escrow epi ou peye l an fiat.';
  adPay();
}
function adPay() {
  const ms = [...document.querySelectorAll('#a-methods input:checked')].map((i) => i.value);
  $('a-pay').innerHTML = adT === 'SELL' ? ms.map((m) => `<p class="lbl">${m}: kont kote achtè a ap voye lajan an</p><div class="grid grid-cols-2 gap-2"><div class="field"><input data-m="${m}" data-k="account" placeholder="Kont / nimewo" maxlength="100"></div><div class="field"><input data-m="${m}" data-k="name" placeholder="Non sou kont lan" maxlength="80"></div></div>`).join('') : '';
}
async function doAd() {
  const err = (m) => { $('a-err').textContent = m; $('a-err').classList.remove('hidden'); };
  const methods = [...document.querySelectorAll('#a-methods input:checked')].map((i) => i.value);
  const payDetails = {}; document.querySelectorAll('#a-pay input').forEach((i) => { (payDetails[i.dataset.m] ||= {})[i.dataset.k] = i.value; });
  const body = { type: adT, fiat: $('a-fiat').value, price: $('a-price').value, total: $('a-total').value, minFiat: $('a-min').value, maxFiat: $('a-max').value, methods, payDetails, payWindowMin: Number($('a-win').value), terms: $('a-terms').value };
  $('a-go').disabled = true;
  try { await api('POST', '/api/p2p/ads', body, key('ad')); delete KEYS.ad; closeSheet(); toast('Anons piblye.', true); vAds(); }
  catch (e) { if (e.code) delete KEYS.ad; err(e.message); $('a-go').disabled = false; }
}

/* ---------- Pòtfèy ---------- */
async function vWallet() {
  const w = await act(() => api('GET', '/api/p2p/wallet')); if (!w) return;
  const pin = me.pinActive ? `<div class="field mt-2"><span>PIN</span><input id="w-pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"></div>` : '';
  $('view').innerHTML = `<div class="grid grid-cols-2 gap-3 mb-4"><div class="panel rounded-2xl p-4"><p class="text-[11px] text-gray-400">Disponib</p><p class="text-xl font-bold gold-text">${num(w.availableStr, 2)}</p><p class="text-[11px] text-gray-500">USDT</p></div>
    <div class="panel rounded-2xl p-4"><p class="text-[11px] text-gray-400">Rezève (escrow)</p><p class="text-xl font-bold">${num(w.reservedStr, 2)}</p><p class="text-[11px] text-gray-500">USDT</p></div></div>
    <div class="panel rounded-2xl p-4 mb-3"><p class="text-sm font-semibold mb-1">Mete lajan nan P2P</p><p class="text-[11px] text-gray-400 mb-2">Pran nan balans dola prensipal ou (1 $ = 1 USDT).</p>
      <div class="field"><span>$</span><input id="w-in" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div><button onclick="bridge('deposit')" class="gold-btn w-full py-2.5 rounded-xl text-sm mt-2">Mete nan P2P</button></div>
    <div class="panel rounded-2xl p-4"><p class="text-sm font-semibold mb-1">Retounen nan balans prensipal</p><p class="text-[11px] text-gray-400 mb-2">Sèlman lajan ki disponib (pa an escrow).</p>
      <div class="field"><span>USDT</span><input id="w-out" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>${pin}<button onclick="bridge('withdraw')" class="w-full py-2.5 rounded-xl text-sm border border-white/10 mt-2">Retounen</button></div>`;
}
async function bridge(dir) {
  const v = $(dir === 'deposit' ? 'w-in' : 'w-out').value.trim();
  const k = 'br:' + dir + ':' + v;   // menm kle pou menm demann: yon retry apre timeout pa double transfè a
  try {
    const body = { amount: v }; if (dir === 'withdraw' && me.pinActive) body.pin = $('w-pin').value;
    await api('POST', '/api/p2p/wallet/' + dir, body, key(k)); delete KEYS[k];
    toast('Transfè fèt.', true); vWallet(); refreshChip();
  } catch (e) { if (e.code) delete KEYS[k]; if (e.message !== '401') toast(e.message, false); }
}

(async () => {
  me = await api('GET', '/api/me');
  if (me.role === 'admin' || me.role === 'support') return (location.href = '/admin.html');
  const g = $('gate');
  if (me.kyc.status !== 'approved') { g.textContent = 'KYC ou dwe apwouve anvan ou fè lòd P2P.'; g.classList.remove('hidden'); }
  else if (!me.profile) { g.innerHTML = 'Konplete enfòmasyon pèsonèl ou nan <a href="/settings.html" class="underline font-semibold">Paramèt</a> anvan ou fè lòd P2P.'; g.classList.remove('hidden'); }
  render();
})();
</script>
</body>
</html>
