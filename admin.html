<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - MORNINGSTAR EXCHANGE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{font-family:'Inter',-apple-system,Roboto,Arial,sans-serif;background:#090a0f;min-height:100vh;color:#e5e7eb}
.gold-text{background:linear-gradient(135deg,#FFF099,#F1C40F 35%,#D4AF37 70%,#996515);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:rgba(18,20,29,.85);border:1px solid rgba(212,175,55,.18)}
.tab{border:1px solid rgba(255,255,255,.12)}
.tab.on{background:#D4AF37;color:#000;font-weight:700}
.b{padding:.45rem .75rem;border-radius:.6rem;font-size:.75rem;font-weight:600}
.thumb{height:7rem;width:100%;object-fit:cover;border-radius:.6rem;border:1px solid rgba(255,255,255,.15);background:#000}
</style>
</head>
<body class="p-4 sm:p-6">
<div class="max-w-3xl mx-auto">
  <div class="flex items-center justify-between mb-5">
    <h1 class="text-lg font-extrabold tracking-wider gold-text uppercase">Admin Panel</h1>
    <button onclick="logout()" class="text-xs text-amber-400"><i class="fa-solid fa-right-from-bracket mr-1"></i>Dekonekte</button>
  </div>
  <div class="grid grid-cols-3 gap-2 mb-5 text-sm">
    <button class="tab on rounded-xl py-2" data-t="kyc" onclick="go('kyc')">KYC</button>
    <button class="tab rounded-xl py-2" data-t="users" onclick="go('users')">Itilizatè</button>
    <button class="tab rounded-xl py-2" data-t="swaps" onclick="go('swaps')">Swap</button>
  </div>
  <div id="msg" class="hidden mb-4 p-3 rounded-xl text-sm bg-red-500/10 border border-red-500/30 text-red-400"></div>
  <div id="list" class="space-y-3 text-sm"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KYC = { pending: ['An atant', 'text-amber-400'], approved: ['Aksepte', 'text-emerald-400'], rejected: ['Refize', 'text-red-400'], reupload: ['Re-upload mande', 'text-orange-400'] };
const IDT = { national_id: 'Kat Nasyonal', driver_license: 'Pèmi Kondwi', passport: 'Paspò' };
let tab = 'kyc';

function fail(t) { $('msg').textContent = t; $('msg').classList.remove('hidden'); }
async function api(url, body) {
  const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.href = '/'; throw new Error('401'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { fail(d.error || 'Erè.'); throw new Error(d.error); }
  $('msg').classList.add('hidden');
  return d;
}
async function logout() { await fetch('/api/logout', { method: 'POST' }); location.href = '/'; }
function go(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  load();
}

async function load() {
  $('list').innerHTML = '<p class="text-gray-400">Chajman...</p>';
  if (tab === 'kyc') {
    const rows = await api('/api/admin/kyc');
    rows.sort((a, b) => (a.status === 'pending' ? -1 : 1) - (b.status === 'pending' ? -1 : 1));
    $('list').innerHTML = rows.length ? rows.map((k) => {
      const [l, c] = KYC[k.status] || [k.status, ''];
      const imgs = Object.keys(k.files || {}).map((s) =>
        `<a href="/api/admin/kyc/${k.id}/${s}" target="_blank" class="block"><img class="thumb" loading="lazy" src="/api/admin/kyc/${k.id}/${s}" alt="${s}"><span class="text-[11px] text-gray-400">${{front:'Devan',back:'Dèyè',selfie:'Selfie'}[s]}</span></a>`).join('');
      return `<div class="card rounded-2xl p-4">
        <div class="flex justify-between gap-2"><div class="min-w-0"><p class="font-semibold truncate">${esc(k.name)}</p><p class="text-xs text-gray-400 truncate">${esc(k.email)}</p></div>
        <div class="text-right text-xs flex-shrink-0"><p class="${c} font-bold">${l}</p><p class="text-gray-400">${IDT[k.idType] || ''}</p></div></div>
        <div class="grid grid-cols-3 gap-2 my-3">${imgs}</div>
        ${k.reason ? `<p class="text-xs text-gray-400 mb-2">Nòt: ${esc(k.reason)}</p>` : ''}
        <div class="flex flex-wrap gap-2">
          <button class="b bg-emerald-600 text-white" onclick="decide('${k.id}','approved')">Aksepte</button>
          <button class="b bg-red-600 text-white" onclick="decide('${k.id}','rejected')">Refize</button>
          <button class="b bg-orange-500 text-black" onclick="decide('${k.id}','reupload')">Mande re-upload</button>
          <button class="b tab" onclick="decide('${k.id}','pending')">An atant</button></div></div>`;
    }).join('') : '<p class="text-gray-400">Pa gen KYC ankò.</p>';
  } else if (tab === 'users') {
    const rows = await api('/api/admin/users');
    $('list').innerHTML = rows.map((u) => {
      const [l, c] = KYC[u.kycStatus] || ['Pa fè KYC', 'text-gray-400'];
      return `<div class="card rounded-2xl p-4 flex justify-between items-center gap-2">
        <div class="min-w-0"><p class="font-semibold truncate">${esc(u.name)} ${u.role === 'admin' ? '<span class="text-amber-400 text-xs">(admin)</span>' : ''}</p>
        <p class="text-xs text-gray-400 truncate">${esc(u.email)}</p><p class="text-xs ${c}">KYC: ${l}</p></div>
        <div class="text-right flex-shrink-0"><p class="font-bold">${Number(u.balance).toFixed(2)}$</p>
        <button class="b tab mt-1" onclick="balance('${u.id}')">± Balans</button></div></div>`;
    }).join('');
  } else {
    const rows = await api('/api/admin/swaps');
    $('list').innerHTML = rows.length ? rows.map((s) => `<div class="card rounded-2xl p-4">
      <div class="flex justify-between"><p class="font-semibold">${esc(s.method)} · ${Number(s.amount).toFixed(2)}$</p><p class="text-xs ${s.status === 'pending' ? 'text-amber-400' : s.status === 'done' ? 'text-emerald-400' : 'text-red-400'}">${s.status}</p></div>
      <p class="text-xs text-gray-400">${esc(s.name)} · ${esc(s.email)}</p>
      <p class="text-sm mt-1 break-all">→ ${esc(s.account)}</p>
      ${s.status === 'pending' ? `<div class="flex gap-2 mt-2"><button class="b bg-emerald-600 text-white" onclick="swap('${s.id}','done')">Make kòm fini</button><button class="b bg-red-600 text-white" onclick="swap('${s.id}','rejected')">Refize + ranbouse</button></div>` : ''}
    </div>`).join('') : '<p class="text-gray-400">Pa gen swap ankò.</p>';
  }
}

async function decide(id, decision) {
  let reason = '';
  if (decision === 'rejected' || decision === 'reupload') {
    reason = prompt('Rezon (opsyonèl, kliyan an ap wè l):', '');
    if (reason === null) return;
  }
  await api(`/api/admin/kyc/${id}/decision`, { decision, reason });
  load();
}
async function balance(id) {
  const v = prompt('Antre montan pou ajoute (egz. 25) oswa retire (egz. -10):');
  if (v === null || v.trim() === '') return;
  await api(`/api/admin/users/${id}/balance`, { delta: parseFloat(v) });
  load();
}
async function swap(id, status) {
  if (!confirm(status === 'done' ? 'Make swap sa kòm fini?' : 'Refize swap sa epi ranbouse kliyan an?')) return;
  await api(`/api/admin/swaps/${id}/status`, { status });
  load();
}

(async () => {
  const r = await fetch('/api/me');
  if (r.status === 401) return (location.href = '/');
  const me = await r.json();
  if (me.role !== 'admin') return (location.href = '/');
  load();
})();
</script>
</body>
</html>
