<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORNINGSTAR EXCHANGE - Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{font-family:'Inter',-apple-system,Roboto,Arial,sans-serif;background:#090a0f;background-image:radial-gradient(circle at 15% 20%,rgba(212,175,55,.08),transparent 40%),radial-gradient(circle at 85% 80%,rgba(255,215,0,.05),transparent 40%);min-height:100vh;color:#e5e7eb;padding-bottom:5.5rem}
.gold-text{background:linear-gradient(135deg,#FFF099,#F1C40F 35%,#D4AF37 70%,#996515);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.gold-btn{background:linear-gradient(135deg,#FFD700,#D4AF37 50%,#B8860B);color:#000;box-shadow:0 4px 15px rgba(212,175,55,.25)}
.gold-btn:disabled{opacity:.4}
.card{background:rgba(18,20,29,.8);backdrop-filter:blur(16px);border:1px solid rgba(212,175,55,.18);box-shadow:0 20px 50px rgba(0,0,0,.8)}
.act{background:linear-gradient(160deg,rgba(30,32,44,.95),rgba(14,15,22,.95));border:1px solid rgba(212,175,55,.25);box-shadow:0 8px 20px rgba(0,0,0,.6);transition:all .2s ease}
.act:hover,.act:active{border-color:#D4AF37;transform:translateY(-1px)}
.m{border:1px solid rgba(255,255,255,.12);background:rgba(10,11,16,.8)}
.m.active{border-color:#D4AF37;background:rgba(212,175,55,.1)}
input,select{background:rgba(10,11,16,.9);border:1px solid rgba(255,255,255,.15);color:#fff}
input:focus,select:focus{outline:2px solid #D4AF37}
.pill{font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:999px;white-space:nowrap}
.nav{background:rgba(12,13,19,.95);backdrop-filter:blur(14px);border-top:1px solid rgba(212,175,55,.18)}
</style>
</head>
<body>
<div class="max-w-md mx-auto px-4 pt-5">

  <div class="flex items-center justify-between mb-5">
    <div class="flex items-center gap-3 min-w-0">
      <div id="avatar" class="w-11 h-11 rounded-full flex items-center justify-center font-bold gold-btn flex-shrink-0">?</div>
      <div class="min-w-0">
        <p id="uname" class="font-semibold truncate leading-tight">...</p>
        <p class="text-[11px] text-gray-400 uppercase tracking-wider">Morningstar Exchange</p>
      </div>
    </div>
    <button onclick="note('Pa gen nouvo notifikasyon.', true)" class="card w-11 h-11 rounded-full flex items-center justify-center text-amber-400" aria-label="Notifikasyon"><i class="fa-regular fa-bell"></i></button>
  </div>

  <div id="msg" class="hidden mb-4 p-3 rounded-xl text-sm"></div>

  <div class="card rounded-2xl p-6 text-center mb-4">
    <p class="text-xs uppercase tracking-wider text-gray-400">Balans disponib</p>
    <p id="balance" class="text-4xl font-extrabold gold-text mt-1">0.00 HTG</p>
    <p id="usd" class="hidden mt-3 text-sm text-gray-300"></p>
  </div>

  <div class="grid grid-cols-2 gap-3 mb-5">
    <button onclick="soon('Depo')" class="act rounded-2xl py-4 text-center"><i class="fa-solid fa-wallet text-xl text-amber-400 block mb-1.5"></i><span class="text-sm font-semibold">Depo</span></button>
    <button onclick="openWd()" class="act rounded-2xl py-4 text-center"><i class="fa-solid fa-money-bill-transfer text-xl text-amber-400 block mb-1.5"></i><span class="text-sm font-semibold">Retrè</span></button>
    <button onclick="openSwap()" class="act rounded-2xl py-4 text-center"><i class="fa-solid fa-arrows-rotate text-xl text-amber-400 block mb-1.5"></i><span class="text-sm font-semibold">Swap</span></button>
    <button onclick="soon('Echanj')" class="act rounded-2xl py-4 text-center"><i class="fa-solid fa-right-left text-xl text-amber-400 block mb-1.5"></i><span class="text-sm font-semibold">Echanj</span></button>
  </div>

  <div id="history" class="card rounded-2xl p-4">
    <div class="flex items-center justify-between gap-2 mb-3">
      <h2 class="text-sm font-bold">Istwa tranzaksyon</h2>
      <select id="filter" onchange="renderHistory()" class="text-xs rounded-lg px-2 py-1.5">
        <option value="">Tout</option><option value="pending">An kou</option><option value="done">Fini</option><option value="rejected">Echwe</option>
      </select>
    </div>
    <input id="search" oninput="renderHistory()" type="search" placeholder="Chèche (metòd, montan...)" class="w-full rounded-lg px-3 py-2 text-xs mb-3">
    <div id="tx" class="text-sm divide-y divide-white/5 max-h-64 overflow-y-auto"></div>
  </div>
</div>

<nav class="nav fixed bottom-0 inset-x-0 z-40">
  <div class="max-w-md mx-auto grid grid-cols-3 text-center text-gray-400">
    <button onclick="window.scrollTo({top:0,behavior:'smooth'})" class="py-3 text-amber-400" aria-label="Akèy"><i class="fa-solid fa-house text-lg"></i></button>
    <button onclick="document.getElementById('history').scrollIntoView({behavior:'smooth'})" class="py-3" aria-label="Istwa"><i class="fa-solid fa-wallet text-lg"></i></button>
    <button onclick="openSettings()" class="py-3" aria-label="Paramèt"><i class="fa-solid fa-gear text-lg"></i></button>
  </div>
</nav>

<!-- Modal Swap HTG -> USD/USDT -->
<div id="m-swap" class="modal hidden fixed inset-0 bg-black/80 flex items-end sm:items-center justify-center p-3 z-50">
  <div class="card rounded-2xl p-5 w-full max-w-md max-h-[92vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-3"><h2 class="font-bold">Swap HTG → $ / USDT</h2><button onclick="closeModals()" class="text-gray-400 text-2xl leading-none" aria-label="Fèmen">&times;</button></div>
    <p class="text-xs text-gray-400 mb-4">Chanje balans HTG ou an dola (USD/USDT). Apre swap la, dola a parèt nan balans ou.</p>
    <p id="rate" class="text-xs text-amber-400 mb-3"></p>
    <label class="text-xs uppercase tracking-wider text-gray-300">Montan an HTG</label>
    <input id="s-amount" oninput="preview()" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" class="w-full rounded-xl p-3 mt-1 mb-3">
    <p id="s-prev" class="text-sm text-gray-300 mb-4">Ou ap resevwa: $0.00</p>
    <p id="s-err" class="text-red-400 text-sm mb-3 hidden"></p>
    <button id="s-go" onclick="doSwap()" class="gold-btn w-full py-3 rounded-xl font-bold uppercase text-sm">Konfime swap</button>
  </div>
</div>

<!-- Modal Retrè -->
<div id="m-wd" class="modal hidden fixed inset-0 bg-black/80 flex items-end sm:items-center justify-center p-3 z-50">
  <div class="card rounded-2xl p-5 w-full max-w-md max-h-[92vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-3"><h2 class="font-bold">Retrè</h2><button onclick="closeModals()" class="text-gray-400 text-2xl leading-none" aria-label="Fèmen">&times;</button></div>
    <div id="cur-row" class="grid grid-cols-2 gap-2 mb-3"></div>
    <p id="wd-hint" class="text-xs text-gray-400 mb-3"></p>
    <p class="text-xs uppercase tracking-wider text-gray-300 mb-2">Chwazi metòd la</p>
    <div id="methods" class="grid grid-cols-3 gap-2 mb-4"></div>
    <label id="w-label" class="text-xs uppercase tracking-wider text-gray-300">Montan</label>
    <input id="w-amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" class="w-full rounded-xl p-3 mt-1 mb-4">
    <label id="acc-label" class="text-xs uppercase tracking-wider text-gray-300">Kont destinasyon</label>
    <input id="w-account" type="text" maxlength="100" class="w-full rounded-xl p-3 mt-1 mb-4">
    <p id="w-err" class="text-red-400 text-sm mb-3 hidden"></p>
    <button id="w-go" onclick="doWd()" class="gold-btn w-full py-3 rounded-xl font-bold uppercase text-sm">Konfime retrè</button>
  </div>
</div>

<div id="m-set" class="modal hidden fixed inset-0 bg-black/80 flex items-end justify-center p-3 z-50">
  <div class="card rounded-2xl p-5 w-full max-w-md">
    <div class="flex justify-between items-center mb-3"><h2 class="font-bold">Paramèt</h2><button onclick="closeModals()" class="text-gray-400 text-2xl leading-none" aria-label="Fèmen">&times;</button></div>
    <p id="s-name" class="font-semibold"></p><p id="s-email" class="text-xs text-gray-400 mb-4"></p>
    <button onclick="logout()" class="gold-btn w-full py-3 rounded-xl font-bold text-sm"><i class="fa-solid fa-right-from-bracket mr-2"></i>Dekonekte</button>
  </div>
</div>

<script>
const W = {
  HTG: ['MonCash', 'NatCash'],
  USD: ['Meru', 'Zelle', 'USDT', 'CashApp', 'PayPal']
};
const MI = {
  MonCash: ['fa-mobile-screen', 'Nimewo MonCash'], NatCash: ['fa-mobile-screen-button', 'Nimewo NatCash'],
  Meru: ['fa-wallet', 'Kont Meru'], USDT: ['fa-coins', 'Adrès wallet USDT'], Zelle: ['fa-building-columns', 'Imèl oswa telefòn Zelle'],
  CashApp: ['fa-dollar-sign', '$Cashtag CashApp'], PayPal: ['fa-credit-card', 'Imèl PayPal']
};
const STATUS = {
  pending: ['An kou', 'bg-amber-500/15 text-amber-400'], done: ['Fini', 'bg-emerald-500/15 text-emerald-400'], rejected: ['Echwe', 'bg-red-500/15 text-red-400']
};
let me = null, cur = 'HTG', method = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (n) => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const htg = (n) => num(n) + ' HTG';
const usd = (n) => '$' + num(n);
const fmt = (n, c) => (c === 'USD' ? usd(n) : htg(n));
const fdate = (iso) => { const d = new Date(iso), p = (x) => String(x).padStart(2, '0'); return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}`; };

let nt;
function note(t, ok) {
  const m = $('msg');
  m.className = 'mb-4 p-3 rounded-xl text-sm border ' + (ok ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400' : 'bg-red-500/10 border-red-500/30 text-red-400');
  m.textContent = t; clearTimeout(nt); nt = setTimeout(() => m.classList.add('hidden'), 5000);
}
const soon = (n) => note(n + ' pa disponib ankò. N ap ajoute l byento.', true);
async function logout() { await fetch('/api/logout', { method: 'POST' }); location.href = '/'; }
function closeModals() { document.querySelectorAll('.modal').forEach((m) => m.classList.add('hidden')); }
function openSettings() { $('s-name').textContent = me.name; $('s-email').textContent = me.email; $('m-set').classList.remove('hidden'); }

function renderHistory() {
  const f = $('filter').value, q = $('search').value.trim().toLowerCase();
  const rows = me.txs.filter((t) => (!f || t.status === f) &&
    (!q || ((t.method || 'swap') + ' ' + t.amount + ' ' + t.type).toLowerCase().includes(q)));
  $('tx').innerHTML = rows.length ? rows.map((t) => {
    const [l, c] = STATUS[t.status] || ['', ''];
    const label = t.type === 'swap' ? 'Swap HTG → USD' : 'Retrè · ' + esc(t.method);
    const sub = t.type === 'swap' ? `-${htg(t.amount)} / +${usd(t.usd)}` : `-${fmt(t.amount, t.currency === 'USD' ? 'USD' : 'HTG')}`;
    return `<div class="flex items-center justify-between gap-2 py-2.5"><span class="text-gray-400 text-xs w-16 flex-shrink-0">${fdate(t.createdAt)}</span>
      <span class="flex-1 min-w-0 truncate">${label}<span class="block text-xs text-gray-400">${sub}</span></span><span class="pill ${c}">${l}</span></div>`;
  }).join('') : '<p class="text-gray-500 text-xs py-4 text-center">Pa gen tranzaksyon.</p>';
}

function render() {
  $('uname').textContent = me.name;
  $('avatar').textContent = (me.name.trim()[0] || '?').toUpperCase();
  $('balance').textContent = htg(me.balance);
  const u = $('usd');
  u.classList.toggle('hidden', !(me.usd > 0));
  u.innerHTML = `<i class="fa-solid fa-dollar-sign text-amber-400 mr-1"></i>${usd(me.usd)} <span class="text-xs text-gray-400">(USD / USDT)</span>`;
  renderHistory();
}

/* ---- Swap ---- */
function openSwap() {
  if (me.balance <= 0) return note('Balans HTG ou se 0.00. Ou pa ka fè swap pou kounye a.', false);
  if (!me.rate) return note('To chanj la poko disponib. Eseye pita.', false);
  $('rate').textContent = `To a: $1 = ${num(me.rate)} HTG`;
  $('s-amount').value = ''; $('s-err').classList.add('hidden'); preview();
  $('m-swap').classList.remove('hidden');
}
function preview() {
  const a = parseFloat($('s-amount').value) || 0;
  $('s-prev').textContent = 'Ou ap resevwa: ' + usd(Math.floor((a / (me.rate || 1)) * 100) / 100);
}
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Erè. Eseye ankò.');
  return d;
}
async function doSwap() {
  const e = (t) => { $('s-err').textContent = t; $('s-err').classList.remove('hidden'); };
  const amount = parseFloat($('s-amount').value);
  if (!(amount > 0)) return e('Antre yon montan valid.');
  if (amount > me.balance) return e('Balans HTG ou pa sifi.');
  $('s-go').disabled = true;
  try { me = await post('/api/swap', { amount }); render(); closeModals(); note('Swap fèt! Dola a nan balans ou.', true); }
  catch (x) { e(x.message); }
  $('s-go').disabled = false;
}

/* ---- Retrè ---- */
function openWd() {
  if (me.balance <= 0 && me.usd <= 0) return note('Ou pa gen balans pou retire.', false);
  cur = me.balance > 0 ? 'HTG' : 'USD'; setCur(cur);
  $('w-amount').value = ''; $('w-account').value = ''; $('w-err').classList.add('hidden');
  $('m-wd').classList.remove('hidden');
}
function setCur(c) {
  cur = c; method = null;
  $('cur-row').innerHTML = [['HTG', 'Goud (HTG)', me.balance], ['USD', 'Dola (USD/USDT)', me.usd]].map(([k, l, b]) =>
    `<button type="button" ${b > 0 ? '' : 'disabled'} onclick="setCur('${k}')" class="m rounded-xl py-2 px-2 text-center text-xs ${cur === k ? 'active' : ''} ${b > 0 ? '' : 'opacity-40'}"><span class="font-semibold block">${l}</span><span class="text-gray-400">${fmt(b, k)}</span></button>`).join('');
  $('wd-hint').textContent = c === 'HTG'
    ? 'Balans HTG ka retire sèlman sou MonCash ak NatCash. Pou Meru, Zelle, USDT, CashApp, PayPal, fè yon swap an dola dabò.'
    : 'Retire dola ou sou Meru, Zelle, USDT, CashApp oswa PayPal.';
  $('w-label').textContent = c === 'HTG' ? 'Montan an HTG' : 'Montan an dola ($)';
  $('acc-label').textContent = 'Kont destinasyon';
  $('methods').innerHTML = W[c].map((k) => `<button type="button" data-m="${k}" onclick="pickM('${k}')" class="m rounded-xl py-3 text-center"><i class="fa-solid ${MI[k][0]} text-amber-400 text-lg block mb-1"></i><span class="text-xs font-semibold">${k}</span></button>`).join('');
}
function pickM(k) {
  method = k;
  document.querySelectorAll('#methods .m').forEach((b) => b.classList.toggle('active', b.dataset.m === k));
  $('acc-label').textContent = MI[k][1];
}
async function doWd() {
  const e = (t) => { $('w-err').textContent = t; $('w-err').classList.remove('hidden'); };
  const amount = parseFloat($('w-amount').value), bal = cur === 'HTG' ? me.balance : me.usd;
  if (!method) return e('Chwazi yon metòd.');
  if (!(amount > 0)) return e('Antre yon montan valid.');
  if (amount > bal) return e('Balans ou pa sifi.');
  if ($('w-account').value.trim().length < 3) return e('Antre kont destinasyon an.');
  $('w-go').disabled = true;
  try { me = await post('/api/withdraw', { currency: cur, method, amount, account: $('w-account').value }); render(); closeModals(); note('Demann retrè a voye. Ekip nou ap trete l.', true); }
  catch (x) { e(x.message); }
  $('w-go').disabled = false;
}

(async () => {
  const r = await fetch('/api/me');
  if (r.status === 401) return (location.href = '/');
  me = await r.json();
  if (me.role === 'admin') return (location.href = '/admin.html');
  if (me.kyc.status !== 'approved') return (location.href = '/kyc.html');
  render();
})();
</script>
</body>
</html>
