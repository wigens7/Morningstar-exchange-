    <style>
        /* Typography mimicking Amazon Ember typography style */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Amazon Ember', 'Helvetica Neue', Roboto, Arial, sans-serif;
            background-color: #090a0f;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255, 215, 0, 0.05) 0%, transparent 40%);
            min-height: 100vh;
        }

        /* Gold Gradient Text and Accents */
        .gold-text {
            background: linear-gradient(135deg, #FFF099 0%, #F1C40F 35%, #D4AF37 70%, #996515 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
        }

        .gold-glow-btn {
            background: linear-gradient(135deg, #FFD700 0%, #D4AF37 50%, #B8860B 100%);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
        }

        .gold-glow-btn:hover {
            background: linear-gradient(135deg, #FFE033 0%, #E5C138 50%, #C9970C 100%);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-1px);
        }

        .gold-border-focus:focus-within {
            border-color: #D4AF37 !important;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(18, 20, 29, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.18);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        /* Custom Input styling */
        .custom-input {
            background-color: rgba(10, 11, 16, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f3f4f6;
            transition: all 0.25s ease;
        }

        .custom-input:focus {
            background-color: rgba(15, 17, 25, 0.95);
            outline: none;
        }

        /* Smooth Tab Transition Animations */
        .form-container {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .form-hidden {
            display: none;
            opacity: 0;
            transform: translateX(20px);
        }

        .form-visible {
            display: block;
            opacity: 1;
            transform: translateX(0);
        }

        /* Custom Checkbox */
        .custom-checkbox:checked {
            background-color: #D4AF37;
            border-color: #D4AF37;
        }
    </style>

            <div id="alert-box" class="hidden mb-6 p-3.5 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-3">
                <i id="alert-icon" class="fa-solid text-base"></i>
                <span id="alert-msg"></span>
            </div>

            <!-- ================= FÒM PIN (sèlman si PIN aktif + sesyon aparèy la poko ekspire) ================= -->
            <form id="form-pin" class="hidden" onsubmit="handlePinLogin(event)">
                <div class="space-y-4">
                    <div class="text-center">
                        <p class="text-sm text-gray-300">Byenveni ankò, <span id="pin-name" class="text-amber-400 font-semibold"></span></p>
                        <p id="pin-email" class="text-xs text-gray-500 mt-0.5"></p>
                    </div>
                    <div>
                        <label for="pin-input" class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">PIN 6 chif</label>
                        <div class="relative flex items-center gold-border-focus rounded-xl">
                            <i class="fa-solid fa-key absolute left-4 text-gray-400"></i>
                            <input type="password" id="pin-input" required inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="off" placeholder="••••••"
                                class="custom-input w-full pl-11 pr-11 py-3 rounded-xl text-sm tracking-[0.5em] placeholder-gray-500">
                            <button type="button" onclick="togglePasswordVisibility('pin-input', 'pin-eye')"
                                class="absolute right-4 text-gray-400 hover:text-gray-200 focus:outline-none">
                                <i id="pin-eye" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="gold-glow-btn w-full mt-2 py-3.5 px-4 rounded-xl text-black font-bold text-sm tracking-wide uppercase flex items-center justify-center gap-2">
                        <span>Konekte ak PIN</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                    <p class="text-center text-xs text-gray-400 pt-1">
                        <button type="button" onclick="showPasswordLogin()" class="text-amber-400 font-semibold hover:underline">Itilize imèl ak mòdpas</button>
                    </p>
                </div>
            </form>

            <!-- ================= FORMULAIRE SIGN IN (KONEKTE) ================= -->
            <form id="form-signin" class="form-container form-visible" onsubmit="handleSignIn(event)">
                <div class="space-y-4">
                    
                    <!-- Email -->
                    <div>
                        <label for="signin-email" class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">
                            Adres Imèl
                        </label>
                        <div class="relative flex items-center gold-border-focus rounded-xl">
                            <i class="fa-regular fa-envelope absolute left-4 text-gray-400"></i>
                            <input type="email" id="signin-email" required placeholder="nom@egzanp.com"
                                class="custom-input w-full pl-11 pr-4 py-3 rounded-xl text-sm placeholder-gray-500">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label for="signin-password" class="block text-xs font-semibold uppercase tracking-wider text-gray-300">
                                Mòdpas
                            </label>
                            <a href="#" onclick="showNotification('Mande yon lyen pou reinitialise mòdpas ou nan imèl ou.', 'info')" class="text-xs text-amber-400 hover:text-amber-300 transition-colors">
                                Mòdpas bliye?
                            </a>
                        </div>
                        <div class="relative flex items-center gold-border-focus rounded-xl">
                            <i class="fa-solid fa-lock absolute left-4 text-gray-400"></i>
                            <input type="password" id="signin-password" required placeholder="Mòdpas" autocomplete="current-password"
                                class="custom-input w-full pl-11 pr-11 py-3 rounded-xl text-sm placeholder-gray-500">
                            <button type="button" onclick="togglePasswordVisibility('signin-password', 'signin-eye')" 
                                class="absolute right-4 text-gray-400 hover:text-gray-200 focus:outline-none">
                                <i id="signin-eye" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="flex items-center pt-1">
                        <input type="checkbox" id="remember-me" class="w-4 h-4 rounded custom-checkbox bg-black/50 border-gray-600 focus:ring-0 focus:ring-offset-0">
                        <label for="remember-me" class="ml-2 text-xs text-gray-300 select-none">
                            Sonje mwen sou aparèy sa a
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="gold-glow-btn w-full mt-6 py-3.5 px-4 rounded-xl text-black font-bold text-sm tracking-wide uppercase flex items-center justify-center gap-2">
                        <span>Konekte Kounye a</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>

                <!-- Footer Switch -->
                <p class="text-center text-xs text-gray-400 mt-6">
                    Ou pa gen yon kont ankò? 
                    <button type="button" onclick="switchTab('signup')" class="text-amber-400 font-semibold hover:underline ml-1">
                        Kreye yon kont gratis
                    </button>
                </p>
            </form>

            <!-- ================= FORMULAIRE SIGN UP (ENSKRI) ================= -->
            <form id="form-signup" class="form-container form-hidden" onsubmit="handleSignUp(event)">
                <div class="space-y-4">
                    
                    <!-- Full Name -->
                    <div>
                        <label for="signup-name" class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">
                            Non Konplè
                        </label>
                        <div class="relative flex items-center gold-border-focus rounded-xl">
                            <i class="fa-regular fa-user absolute left-4 text-gray-400"></i>
                            <input type="text" id="signup-name" required placeholder="Jean Baptiste"
                                class="custom-input w-full pl-11 pr-4 py-3 rounded-xl text-sm placeholder-gray-500">
                        </div>
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="signup-email" class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">
                            Adres Imèl
                        </label>
                        <div class="relative flex items-center gold-border-focus rounded-xl">
                            <i class="fa-regular fa-envelope absolute left-4 text-gray-400"></i>
                            <input type="email" id="signup-email" required placeholder="nom@egzanp.com"
                                class="custom-input w-full pl-11 pr-4 py-3 rounded-xl text-sm placeholder-gray-500">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="signup-password" class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">
                            Mòdpas
                        </label>
                        <div class="relative flex items-center gold-border-focus rounded-xl">
                            <i class="fa-solid fa-lock absolute left-4 text-gray-400"></i>
                            <input type="password" id="signup-password" required placeholder="Atòm 8 karaktè" minlength="8"
                                class="custom-input w-full pl-11 pr-11 py-3 rounded-xl text-sm placeholder-gray-500">
                            <button type="button" onclick="togglePasswordVisibility('signup-password', 'signup-eye1')" 
                                class="absolute right-4 text-gray-400 hover:text-gray-200 focus:outline-none">
                                <i id="signup-eye1" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Repeat Password -->
                    <div>
                        <label for="signup-confirm-password" class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">
                            Repete Mòdpas
                        </label>
                        <div class="relative flex items-center gold-border-focus rounded-xl">
                            <i class="fa-solid fa-shield-halved absolute left-4 text-gray-400"></i>
                            <input type="password" id="signup-confirm-password" required placeholder="Rantre mòdpas la ankò"
                                class="custom-input w-full pl-11 pr-11 py-3 rounded-xl text-sm placeholder-gray-500">
                            <button type="button" onclick="togglePasswordVisibility('signup-confirm-password', 'signup-eye2')" 
                                class="absolute right-4 text-gray-400 hover:text-gray-200 focus:outline-none">
                                <i id="signup-eye2" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Terms checkbox -->
                    <div class="flex items-start pt-1">
                        <input type="checkbox" id="terms" required class="mt-0.5 w-4 h-4 rounded custom-checkbox bg-black/50 border-gray-600 focus:ring-0 focus:ring-offset-0">
                        <label for="terms" class="ml-2 text-xs text-gray-400 leading-relaxed">
                            Mwen aksepte <a href="#" class="text-amber-400 hover:underline">Kondisyon Sèvis</a> ak <a href="/privacy.html" target="_blank" class="text-amber-400 hover:underline">Règleman Konfidansyalite</a> Morningstar Exchange.
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="gold-glow-btn w-full mt-6 py-3.5 px-4 rounded-xl text-black font-bold text-sm tracking-wide uppercase flex items-center justify-center gap-2">
                        <span>Ouvri Kont Mwen</span>
                        <i class="fa-solid fa-user-check text-xs"></i>
                    </button>
                </div>

                <!-- Footer Switch -->
                <p class="text-center text-xs text-gray-400 mt-6">
                    Ou deja gen yon kont? 
                    <button type="button" onclick="switchTab('signin')" class="text-amber-400 font-semibold hover:underline ml-1">
                        Konekte la a
                    </button>
                </p>
            </form>

        </div>

        <!-- Footer Copyright -->
        <div class="text-center mt-8 text-xs text-gray-500">
            <div class="flex justify-center space-x-4 mt-2 text-gray-400">
                <a href="/privacy.html" class="hover:text-amber-400 transition-colors">Privacy Policy</a>
                <span>•</span>
                <a href="#" class="hover:text-amber-400 transition-colors">Kondisyon</a>
            </div>
            <p class="mt-2 text-gray-500">2026 powered by <span class="text-amber-400 font-semibold">ScamKillerdev</span></p>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // Fonksyon pou pase soti nan Sign In pou ale nan Sign Up (ak envèrsman)
        const REF = new URLSearchParams(location.search).get('ref') || '';
        function switchTab(tab) {
            const formSignIn = document.getElementById('form-signin');
            const formSignUp = document.getElementById('form-signup');
            const tabSignIn = document.getElementById('tab-signin');
            const tabSignUp = document.getElementById('tab-signup');
            const alertBox = document.getElementById('alert-box');

            // Kache mesaj avètisman yo lè n ap pase nan yon lòt tab
            alertBox.classList.add('hidden');
            document.getElementById('form-pin').classList.add('hidden');

            if (tab === 'signin') {
                formSignUp.classList.remove('form-visible');
                formSignUp.classList.add('form-hidden');
                
                formSignIn.classList.remove('form-hidden');
                formSignIn.classList.add('form-visible');

                // Style bouton tab
                tabSignIn.className = "flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-300 text-yellow-400 bg-amber-500/10 border border-yellow-500/20 shadow-sm";
                tabSignUp.className = "flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-300 text-gray-400 hover:text-gray-200";
            } else {
                formSignIn.classList.remove('form-visible');
                formSignIn.classList.add('form-hidden');

                formSignUp.classList.remove('form-hidden');
                formSignUp.classList.add('form-visible');

                // Style bouton tab
                tabSignUp.className = "flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-300 text-yellow-400 bg-amber-500/10 border border-yellow-500/20 shadow-sm";
                tabSignIn.className = "flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-300 text-gray-400 hover:text-gray-200";
            }
        }

        // Fonksyon pou montre/kache mòdpas (Eye icon toggle)
        function togglePasswordVisibility(inputId, eyeIconId) {
            const input = document.getElementById(inputId);
            const eyeIcon = document.getElementById(eyeIconId);

            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Afiche nouvèl oswa mesaj erè/siksè
        function showNotification(message, type = 'error') {
            const alertBox = document.getElementById('alert-box');
            const alertMsg = document.getElementById('alert-msg');
            const alertIcon = document.getElementById('alert-icon');

            alertBox.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400', 'bg-amber-500/10', 'border-amber-500/30', 'text-amber-400');

            if (type === 'error') {
                alertBox.classList.add('bg-red-500/10', 'border', 'border-red-500/30', 'text-red-400');
                alertIcon.className = 'fa-solid fa-circle-exclamation text-red-400';
            } else if (type === 'success') {
                alertBox.classList.add('bg-emerald-500/10', 'border', 'border-emerald-500/30', 'text-emerald-400');
                alertIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            } else {
                alertBox.classList.add('bg-amber-500/10', 'border', 'border-amber-500/30', 'text-amber-400');
                alertIcon.className = 'fa-solid fa-circle-info text-amber-400';
            }

            alertMsg.textContent = message;
        }

        async function api(url, body) {
            const r = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(d.error || 'Gen yon erè. Tanpri eseye ankò.');
            return d;
        }

        function destFor(u) {
            if (u.role === 'admin' || u.role === 'support') return '/admin.html';
            return u.kyc.status === 'approved' ? '/dashboard.html' : '/kyc.html';
        }

        function goToKyc(u) {
            showNotification('Koneksyon reyisi!', 'success');
            setTimeout(() => { window.location.href = destFor(u); }, 700);
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type=submit]');
            btn.disabled = true;
            try {
                const u = await api('/api/login', {
                    email: document.getElementById('signin-email').value,
                    password: document.getElementById('signin-password').value,
                    remember: document.getElementById('remember-me').checked
                });
                goToKyc(u);
            } catch (err) {
                showNotification(err.message, 'error');
                btn.disabled = false;
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const password = document.getElementById('signup-password').value;
            if (password !== document.getElementById('signup-confirm-password').value) {
                showNotification('Mòdpas yo pa menm. Tanpri verifye yo ankò.', 'error');
                return;
            }
            if (password.length < 8) {
                showNotification('Mòdpas la dwe gen pou pi piti 8 karaktè.', 'error');
                return;
            }
            const btn = e.target.querySelector('button[type=submit]');
            btn.disabled = true;
            try {
                const u = await api('/api/signup', {
                    name: document.getElementById('signup-name').value,
                    ref: REF,
                    email: document.getElementById('signup-email').value,
                    password
                });
                goToKyc(u);
            } catch (err) {
                showNotification(err.message, 'error');
                btn.disabled = false;
            }
        }


        // ---- Koneksyon ak PIN: fòm nan parèt sèlman si sèvè a konfime PIN aktif + sesyon aparèy la valid ----
        function showPasswordLogin() {
            document.getElementById('form-pin').classList.add('hidden');
            document.getElementById('alert-box').classList.add('hidden');
            document.getElementById('tab-signin').parentElement.classList.remove('hidden');
            switchTab('signin');
        }

        async function handlePinLogin(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type=submit]');
            const pin = document.getElementById('pin-input').value;
            if (!/^\d{6}$/.test(pin)) return showNotification('PIN lan dwe gen 6 chif.', 'error');
            btn.disabled = true;
            try {
                goToKyc(await api('/api/login-pin', { pin }));
            } catch (err) {
                showNotification(err.message, 'error');
                document.getElementById('pin-input').value = '';
                btn.disabled = false;
            }
        }

        async function initPinForm() {
            try {
                const r = await fetch('/api/pin-hint');
                const h = await r.json();
                if (!h.available) return;
                document.getElementById('pin-name').textContent = h.name;
                document.getElementById('pin-email').textContent = h.email;
                document.getElementById('form-signin').classList.replace('form-visible', 'form-hidden');
                document.getElementById('form-pin').classList.remove('hidden');
            } catch (_) {}
        }

        if (REF) switchTab('signup');

        // Si kliyan an deja konekte, voye l dirèk nan KYC
        fetch('/api/me').then(r => r.ok ? r.json() : null).then(u => { if (u) window.location.href = destFor(u); else if (!REF) initPinForm(); }).catch(() => {});
    </script>
</body>
</html>
