<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - MORNINGSTAR EXCHANGE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#07080c;--panel:#0e1016;--panel2:#12151d;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--gold:#D4AF37;--muted:#8b93a3}
*{-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',-apple-system,Roboto,Arial,sans-serif;background:var(--bg);background-image:radial-gradient(900px 400px at 10% -10%,rgba(212,175,55,.09),transparent 60%);min-height:100vh;color:#e5e7eb}
.gold-text{background:linear-gradient(135deg,#FFF099,#F1C40F 35%,#D4AF37 70%,#996515);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
/* layout */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{position:sticky;top:0;z-index:30;background:rgba(10,11,16,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:.7rem .9rem .6rem}
.brand{display:flex;align-items:center;gap:.65rem}
.brand-mark{width:2.1rem;height:2.1rem;border-radius:.65rem;display:grid;place-items:center;background:linear-gradient(135deg,rgba(212,175,55,.25),rgba(212,175,55,.05));border:1px solid rgba(212,175,55,.35);color:#F1C40F;font-size:.95rem}
.brand h1{font-size:.8rem;font-weight:800;letter-spacing:.14em;line-height:1.1}
.brand small{display:block;font-size:.62rem;color:var(--muted);letter-spacing:.08em;font-weight:500;margin-top:2px;text-transform:uppercase}
.logout{margin-left:auto;font-size:.75rem;color:var(--muted);border:1px solid var(--line2);border-radius:.6rem;padding:.4rem .65rem;transition:.15s}
.logout-d{display:none}
.logout:hover{color:#fff;border-color:rgba(212,175,55,.5)}
.nav{display:flex;gap:.4rem;overflow-x:auto;padding:.7rem 0 .1rem;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav .tab{display:flex;align-items:center;gap:.5rem;white-space:nowrap;font-size:.78rem;font-weight:600;color:#aab1bf;padding:.5rem .8rem;border-radius:.7rem;border:1px solid transparent;transition:.15s;position:relative}
.nav .tab i{font-size:.8rem;width:1rem;text-align:center;opacity:.85}
.nav .tab:hover{background:rgba(255,255,255,.05);color:#fff}
.nav .tab.on{background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(212,175,55,.07));border-color:rgba(212,175,55,.4);color:#F5D76E}
.nbadge{margin-left:auto;min-width:1.15rem;padding:.05rem .4rem;border-radius:999px;background:#dc2626;color:#fff;font-size:.62rem;font-weight:700;text-align:center}
.nbadge.gold{background:var(--gold);color:#000}
.main{padding:1rem .9rem 3rem;max-width:62rem;width:100%}
.pagehead{margin:.2rem 0 1rem}
.pagehead h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.pagehead p{font-size:.78rem;color:var(--muted);margin-top:.15rem}
@media(min-width:900px){
  .shell{grid-template-columns:15.5rem 1fr}
  .side{top:0;height:100vh;border-bottom:0;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:1.2rem .9rem}
  .nav{flex-direction:column;overflow:visible;padding:1.4rem 0 0;gap:.2rem}
  .nav .tab{padding:.65rem .8rem;font-size:.84rem}
  .logout-m{display:none}.logout-d{display:block;margin:auto 0 0;text-align:center}
  .main{padding:1.6rem 2rem 4rem}
}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:1.1rem}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:.8rem .9rem;text-align:left;transition:.15s}
.stat:hover{border-color:rgba(212,175,55,.35);transform:translateY(-1px)}
.stat .n{font-size:1.5rem;font-weight:800;line-height:1.1;margin-top:.25rem}
.stat .l{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:.4rem}
.stat.warn .n{color:#fbbf24}
/* cards + controls */
.card{background:var(--panel);border:1px solid var(--line);border-radius:1rem !important;transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.tab{border:1px solid var(--line2)}
.tab.on{background:#D4AF37;color:#000;font-weight:700}
.on{background:#D4AF37;color:#000;font-weight:700}
.b{padding:.5rem .85rem;border-radius:.65rem;font-size:.75rem;font-weight:600;transition:filter .15s,transform .05s;display:inline-flex;align-items:center;gap:.35rem}
.b:hover{filter:brightness(1.1)}.b:active{transform:scale(.97)}
.b.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:#e5e7eb}
.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent);border:1px solid color-mix(in srgb,currentColor 30%,transparent)}
.pill::before{content:"";width:.38rem;height:.38rem;border-radius:50%;background:currentColor}
.avatar{width:2.5rem;height:2.5rem;flex:none;border-radius:.8rem;display:grid;place-items:center;font-weight:800;color:#F1C40F;background:linear-gradient(135deg,rgba(212,175,55,.22),rgba(212,175,55,.05));border:1px solid rgba(212,175,55,.3)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem}
.chip{font-size:.72rem;font-weight:600;padding:.35rem .7rem;border-radius:999px;border:1px solid var(--line2);color:#aab1bf}
.chip.on{background:rgba(212,175,55,.15);border-color:rgba(212,175,55,.5);color:#F5D76E}
.empty{color:var(--muted);text-align:center;padding:2.5rem 1rem;border:1px dashed var(--line2);border-radius:1rem;font-size:.85rem}
.thumb{height:7rem;width:100%;object-fit:cover;border-radius:.6rem;border:1px solid rgba(255,255,255,.15);background:#000}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(4px)}
.modal.hidden{display:none}
.sheet{width:100%;max-width:28rem;background:var(--panel2);border:1px solid rgba(212,175,55,.2);border-radius:1.5rem 1.5rem 0 0;padding:1.25rem}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:1.5rem}}
.inp{width:100%;background:#0a0b10;border:1px solid var(--line2);border-radius:.8rem;padding:.75rem;color:#fff}
.inp:focus{outline:2px solid #D4AF37}
/* search */
.search{position:relative}
.search i{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem}
.search input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:.8rem;padding:.7rem .9rem .7rem 2.4rem;color:#fff;font-size:.85rem}
.search input:focus{outline:2px solid rgba(212,175,55,.7);border-color:transparent}
.search button{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);color:var(--muted);padding:.3rem .5rem}
/* 360 */
.p360{max-width:46rem;max-height:94dvh;display:flex;flex-direction:column;padding:0;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
@media(min-width:560px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:.8rem;padding:.6rem .7rem}
.kpi .l{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi .v{font-size:.95rem;font-weight:700;margin-top:.15rem;word-break:break-word}
.tl{position:relative;padding-left:1.6rem}
.tl::before{content:"";position:absolute;left:.62rem;top:.3rem;bottom:.3rem;width:2px;background:var(--line2)}
.ti{position:relative;padding:.1rem 0 .85rem}
.ti .dot{position:absolute;left:-1.6rem;top:.1rem;width:1.3rem;height:1.3rem;border-radius:50%;display:grid;place-items:center;font-size:.6rem;background:var(--panel2);border:1px solid currentColor}
.sec-t{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:1rem 0 .5rem}
/* KYC viewer */
.kv{max-width:40rem;max-height:94dvh;display:flex;flex-direction:column;padding:0;overflow:hidden}
.kv-stage{position:relative;background:#050608;min-height:16rem;flex:1;display:grid;place-items:center;overflow:auto}
.kv-stage img{max-width:100%;max-height:62dvh;object-fit:contain;user-select:none;-webkit-user-drag:none}
.kv-note{font-size:.7rem;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-coins"></i></div>
      <div><h1 class="gold-text uppercase">Morningstar</h1><small id="role-label">Admin Panel</small></div>
      <button onclick="logout()" class="logout logout-m"><i class="fa-solid fa-right-from-bracket mr-1"></i>Soti</button>
    </div>
    <nav class="nav" id="nav">
      <button class="tab on" data-t="kyc" onclick="go('kyc')"><i class="fa-regular fa-id-card"></i>KYC<span class="nbadge hidden" id="nb-kyc"></span></button>
      <button class="tab" data-t="users" onclick="go('users')"><i class="fa-solid fa-users"></i>Itilizatè</button>
      <button class="tab" data-t="wd" onclick="go('wd')"><i class="fa-solid fa-arrow-up-from-bracket"></i>Retrè<span class="nbadge hidden" id="nb-wd"></span></button>
      <button class="tab" data-t="dep" onclick="go('dep')"><i class="fa-solid fa-arrow-down-to-bracket"></i>Depo<span class="nbadge hidden" id="nb-dep"></span></button>
      <button class="tab" data-t="dinfo" onclick="go('dinfo')"><i class="fa-solid fa-building-columns"></i>Enfo Depo</button>
      <button class="tab" data-t="p2p" onclick="go('p2p')"><i class="fa-solid fa-right-left"></i>P2P</button>
      <button class="tab" data-t="chat" onclick="go('chat')"><i class="fa-regular fa-comments"></i>Chat<span id="chat-badge" class="nbadge hidden">0</span></button>
      <button class="tab" data-t="set" onclick="go('set')"><i class="fa-solid fa-sliders"></i>To &amp; Frè</button>
    </nav>
    <button onclick="logout()" class="logout logout-d"><i class="fa-solid fa-right-from-bracket mr-1"></i>Dekonekte</button>
  </aside>
  <main class="main">
    <div class="pagehead"><h2 id="page-title">KYC</h2><p id="page-sub"></p></div>
    <div id="stats" class="stats hidden"></div>
    <div id="toolbar" class="mb-3"></div>
    <div id="msg" class="hidden mb-4 p-3 rounded-xl text-sm bg-red-500/10 border border-red-500/30 text-red-400"></div>
    <div id="list" class="space-y-3 text-sm"></div>
  </main>
</div>

<div id="m-kyc" class="modal hidden" onclick="if(event.target===this)closeKyc()">
  <div class="sheet kv">
    <div class="p-4 flex items-start gap-3 border-b border-white/10">
      <div class="min-w-0 flex-1"><p id="kv-name" class="font-bold truncate"></p><p id="kv-sub" class="text-xs text-gray-400 truncate"></p><p id="kv-st" class="mt-1.5"></p></div>
      <button onclick="closeKyc()" class="text-gray-400 text-2xl leading-none px-1" aria-label="Fèmen">&times;</button>
    </div>
    <div id="kv-tabs" class="flex gap-2 px-4 pt-3"></div>
    <div class="p-4 pb-2 flex-1 min-h-0 flex flex-col"><div class="kv-stage rounded-xl border border-white/10" id="kv-stage"></div>
      <p class="kv-note mt-2"><i class="fa-solid fa-shield-halved mr-1"></i>Dokiman sansib. Pa pataje yo. Imaj yo chaje sèlman lè w louvri yo.</p></div>
    <div id="kv-actions" class="p-4 pt-1 flex flex-wrap gap-2 border-t border-white/10"></div>
  </div>
</div>

<div id="m-360" class="modal hidden" onclick="if(event.target===this)close360()">
  <div class="sheet p360" style="max-width:46rem">
    <div class="p-4 flex items-start gap-3 border-b border-white/10">
      <div id="p-av" class="avatar"></div>
      <div class="min-w-0 flex-1"><p id="p-name" class="font-bold truncate"></p><p id="p-sub" class="text-xs text-gray-400 truncate"></p><div id="p-pills" class="flex flex-wrap gap-1.5 mt-1.5"></div></div>
      <button onclick="close360()" class="text-gray-400 text-2xl leading-none px-1" aria-label="Fèmen">&times;</button>
    </div>
    <div class="overflow-y-auto flex-1 p-4" id="p-body"></div>
  </div>
</div>

<div id="m-bal" class="modal hidden" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="sheet">
    <div class="flex justify-between items-center mb-1"><h2 class="font-bold">Mete / retire lajan</h2><button onclick="$('m-bal').classList.add('hidden')" class="text-gray-400 text-2xl leading-none">&times;</button></div>
    <p id="b-who" class="text-xs text-gray-400 truncate"></p>
    <p id="b-cur" class="text-xs text-amber-400 mb-3"></p>
    <div class="grid grid-cols-2 gap-2 mb-2">
      <button class="tab b rounded-xl py-2.5" data-c="HTG" onclick="setBal('HTG')">HTG (Goud)</button>
      <button class="tab b rounded-xl py-2.5" data-c="USD" onclick="setBal('USD')">USD (Dola)</button>
    </div>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <button class="tab b rounded-xl py-2.5" data-s="1" onclick="setBal(null,1)">+ Ajoute</button>
      <button class="tab b rounded-xl py-2.5" data-s="-1" onclick="setBal(null,-1)">− Retire</button>
    </div>
    <input id="b-amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Montan" class="inp mb-2">
    <input id="b-note" type="text" maxlength="100" placeholder="Nòt (opsyonèl, kliyan an ap wè l)" class="inp mb-3">
    <p id="b-err" class="text-red-400 text-xs mb-2 hidden"></p>
    <button onclick="saveBal()" class="w-full py-3 rounded-xl font-bold text-black" style="background:linear-gradient(135deg,#FFD700,#D4AF37 50%,#B8860B)">Konfime</button>
  </div>
</div>
<script src="/dialogs.js"></script>
<script src="/logos.js"></script>
<script src="/admin-p2p.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KYC = { pending: ['An atant', 'text-amber-400'], approved: ['Aksepte', 'text-emerald-400'], rejected: ['Refize', 'text-red-400'], reupload: ['Re-upload mande', 'text-orange-400'] };
const IDT = { national_id: 'Kat Nasyonal', driver_license: 'Pèmi Kondwi', passport: 'Paspò' };
let tab = 'kyc', kycRows = [], kycFilter = 'all', kvUrls = [], q = '', cache = {}, qTimer = null;
const SEARCHABLE = { kyc: 'Chèche pa non, imèl oswa ID...', users: 'Chèche pa non, imèl, ID oswa telefòn...', wd: 'Chèche pa non, imèl, metòd, kont...', dep: 'Chèche pa non, imèl, ID, referans...' };
const has = (...f) => !q || f.map((x) => String(x ?? '')).join(' ').toLowerCase().includes(q.trim().toLowerCase());
function setQ(v) { clearTimeout(qTimer); qTimer = setTimeout(() => { q = v; load(true); }, 150); const c = $('q-clear'); if (c) c.classList.toggle('hidden', !v); }
function clearQ() { const i = $('q-in'); if (i) { i.value = ''; i.focus(); } q = ''; $('q-clear').classList.add('hidden'); load(true); }
const getData = async (k, url, fromCache) => (fromCache && cache[k]) ? cache[k] : (cache[k] = await api(url));
function buildToolbar() {
  const ph = SEARCHABLE[tab];
  $('toolbar').innerHTML = ph ? `<div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q-in" type="search" autocomplete="off" placeholder="${ph}" oninput="setQ(this.value)"><button id="q-clear" class="hidden" onclick="clearQ()" aria-label="Efase"><i class="fa-solid fa-xmark"></i></button></div>` : '';
}
const TITLES = {
  kyc: ['Verifikasyon KYC', 'Revize dokiman kliyan yo anvan w apwouve kont yo.'],
  users: ['Itilizatè', 'Jere kont, balans ak wòl kliyan yo.'],
  wd: ['Retrè', 'Peman kliyan yo mande. Make yo kòm peye oswa refize.'],
  dep: ['Depo', 'Verifye depo kliyan yo epi kredite balans yo.'],
  dinfo: ['Enfo Depo', 'Sa kliyan yo wè lè yo fè yon depo.'],
  p2p: ['Mache P2P', 'Òf, lòd ak dispit ant itilizatè yo.'],
  chat: ['Chat Sipò', 'Konvèsasyon ak kliyan yo.'],
  set: ['To & Frè', 'To chanj ak frè swap yo.']
};

function fail(t) { $('msg').textContent = t; $('msg').classList.remove('hidden'); }
async function api(url, body, method) {
  const r = await fetch(url, (body || method) ? { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined } : {});
  if (r.status === 401) { location.href = '/'; throw new Error('401'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { fail(d.error || 'Erè.'); throw new Error(d.error); }
  $('msg').classList.add('hidden');
  return d;
}
async function logout() { await fetch('/api/logout', { method: 'POST' }); location.href = '/'; }
function go(t) {
  tab = t;
  q = ''; buildToolbar();
  const T = TITLES[t] || [t, '']; $('page-title').textContent = T[0]; $('page-sub').textContent = T[1];
  $('stats').classList.toggle('hidden', t !== 'kyc' || window.ME_ROLE !== 'admin');
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  load();
}

async function refreshStats() {
  if (window.ME_ROLE !== 'admin') return;
  const get = async (u) => { try { const r = await fetch(u); return r.ok ? await r.json() : []; } catch { return []; } };
  const [k, u, w, d] = await Promise.all([get('/api/admin/kyc'), get('/api/admin/users'), get('/api/admin/withdrawals'), get('/api/admin/deposits')]);
  const pend = (a) => a.filter((x) => x.status === 'pending').length;
  const p = { kyc: pend(k), wd: pend(w), dep: pend(d) };
  for (const key of Object.keys(p)) { const b = $('nb-' + key); b.textContent = p[key]; b.classList.toggle('hidden', !p[key]); }
  const S = (ic, l, n, t, warn) => `<button class="stat ${warn && n ? 'warn' : ''}" onclick="go('${t}')"><p class="l"><i class="${ic}"></i>${l}</p><p class="n">${n}</p></button>`;
  $('stats').innerHTML = S('fa-regular fa-id-card', 'KYC an atant', p.kyc, 'kyc', 1) + S('fa-solid fa-arrow-down-to-bracket', 'Depo an atant', p.dep, 'dep', 1)
    + S('fa-solid fa-arrow-up-from-bracket', 'Retrè an atant', p.wd, 'wd', 1) + S('fa-solid fa-users', 'Itilizatè', u.length || 0, 'users');
}

// ---------- Vizyonè KYC (imaj yo chaje sèlman lè admin nan louvri yo) ----------
function closeKyc() {
  $('m-kyc').classList.add('hidden'); $('kv-stage').innerHTML = '';
  kvUrls.forEach((u) => URL.revokeObjectURL(u)); kvUrls = [];
}
async function showKycSlot(id, slot) {
  document.querySelectorAll('#kv-tabs .tab').forEach((b) => b.classList.toggle('on', b.dataset.s === slot));
  const st = $('kv-stage'); st.innerHTML = '<p class="text-gray-500 text-sm"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Chajman...</p>';
  try {
    const r = await fetch(`/api/admin/kyc/${id}/${slot}`);
    if (!r.ok) throw new Error();
    const url = URL.createObjectURL(await r.blob()); kvUrls.push(url);
    st.innerHTML = ''; const im = document.createElement('img');
    im.src = url; im.alt = slot; im.draggable = false; im.oncontextmenu = () => false;
    st.appendChild(im);
  } catch { st.innerHTML = '<p class="text-red-400 text-sm"><i class="fa-regular fa-image mr-2"></i>Imaj la pa disponib.</p>'; }
}
function openKyc(id) {
  const k = kycRows.find((x) => x.id === id); if (!k) return;
  const [l, c] = KYC[k.status] || [k.status, ''];
  $('kv-name').textContent = k.name; $('kv-sub').textContent = `${k.email} · ID ${k.uid}${IDT[k.idType] ? ' · ' + IDT[k.idType] : ''}`;
  $('kv-st').innerHTML = `<span class="pill ${c}">${l}</span>`;
  const slots = Object.keys(k.files || {}); const N = { front: 'Devan', back: 'Dèyè', selfie: 'Selfie' };
  $('kv-tabs').innerHTML = slots.map((s) => `<button class="tab b" data-s="${s}" onclick="showKycSlot('${k.id}','${s}')">${N[s] || s}</button>`).join('');
  $('kv-actions').innerHTML = `<button class="b bg-emerald-600 text-white" onclick="decideKyc('${k.id}','approved')">Aksepte</button>
    <button class="b bg-red-600 text-white" onclick="decideKyc('${k.id}','rejected')">Refize</button>
    <button class="b bg-orange-500 text-black" onclick="decideKyc('${k.id}','reupload')">Mande re-upload</button>`;
  $('m-kyc').classList.remove('hidden');
  if (slots.length) showKycSlot(k.id, slots[0]);
}
async function decideKyc(id, d) { if (await decide(id, d)) closeKyc(); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeKyc(); close360(); } });


// ---------- 360° itilizatè: koneksyon + tout aktivite ----------
const EVT = {
  signup: ['Kreyasyon kont', 'fa-user-plus', 'text-sky-400', 'konek'],
  login: ['Koneksyon', 'fa-right-to-bracket', 'text-emerald-400', 'konek'],
  login_pin: ['Koneksyon (PIN)', 'fa-key', 'text-emerald-400', 'konek'],
  login_fail: ['Echèk koneksyon', 'fa-triangle-exclamation', 'text-red-400', 'konek'],

async function depDecide(id, decision, amount) {
  const body = { decision };
  if (decision === 'done') {
    const v = await uiPrompt('Montan pou kredite (verifye ke ou resevwa l vre):', amount, { numeric: true, ok: 'Kredite' });
    if (v === null) return;
    body.amount = parseFloat(v);
  } else {
    const v = await uiPrompt('Rezon (opsyonèl):', '', { multiline: true, max: 200, ok: 'Refize depo a', danger: true });
    if (v === null) return;
    body.reason = v;
  }
  await api(`/api/admin/deposits/${id}/decision`, body);
  load();
}

async function saveDInfo() {

      const binance = { id: c.querySelector('.d-bid').value.trim(), email: c.querySelector('.d-bem').value.trim() };
      account = binance.id || binance.email || networks.TRC20 || networks.BEP20;
      entry = { active, networks, binance, note: c.querySelector('.d-note').value };
    } else {
      account = c.querySelector('.d-acc').value.trim();
      entry = { active, account, name: c.querySelector('.d-name').value, note: c.querySelector('.d-note').value };
    }
    out[m] = entry;
    if (account && !active) warn.push(m + ' (gen kont men pa aktif)');
    if (active && !account) warn.push(m + ' (aktif men pa gen kont)');
  });
  if (warn.length && !(await uiConfirm('Kliyan yo p ap wè metòd sa yo:\n' + warn.join('\n') + '\n\nKontinye sove?', { ok: 'Sove kanmenm' }))) return;
  const r = await api('/api/admin/deposit-info', { info: out });
  const ok = r.visible.length > 0, el = $('di-ok');
  el.textContent = ok ? 'Sove! Kliyan yo wè kounye a: ' + r.visible.join(', ') : 'Sove, men okenn metòd pa aktif ak yon kont. Kliyan yo pa wè anyen.';
  el.className = 'text-xs ' + (ok ? 'text-emerald-400' : 'text-amber-400');
}

async function loadSettings() {
  const s = await api('/api/admin/settings');
  $('list').innerHTML = `<div class="card rounded-2xl p-4 space-y-4">
    <div><p class="text-xs text-gray-400 mb-1">To chanj kliyan yo wè a</p>
      <div class="flex items-center gap-2"><span class="text-sm whitespace-nowrap">1 USDT =</span><input id="st-rate" type="number" step="0.01" min="0" value="${s.rate}" class="inp"><span class="text-sm">HTG</span></div></div>
    <div class="flex items-center justify-between gap-3"><div><p class="font-semibold text-sm">Frè swap</p><p class="text-xs text-gray-400">Kliyan peye yon pousantaj sou chak swap HTG → dola</p></div>
      <button id="st-active" class="b tab ${s.feeActive ? 'on' : ''}" onclick="this.classList.toggle('on');this.textContent=this.classList.contains('on')?'Aktif':'Dezaktive'">${s.feeActive ? 'Aktif' : 'Dezaktive'}</button></div>
    <div><p class="text-xs text-gray-400 mb-1">Pousantaj frè a (%)</p><input id="st-pct" type="number" step="0.01" min="0" max="50" value="${s.feePercent}" class="inp"><p class="text-[11px] text-gray-500 mt-1">Pousantaj jeneral la. Li sèvi pou tout aktif ki pa gen pwòp pousantaj ki mete anba a.</p></div>
    <div><p class="font-semibold text-sm mb-1">Frè pa aktif (%)</p>
      <p class="text-[11px] text-gray-400 mb-2">Chak aktif ka gen pwòp frè. Kite vid pou itilize pousantaj jeneral la (${s.feePercent}%). Mete 0 pou swap gratis sou aktif sa a. Si Frè swap dezaktive, pa gen frè sou okenn aktif.</p>
      <div class="space-y-2">${['Meru', 'Zelle', 'USDT', 'CashApp', 'PayPal', 'Wise'].map((m) => `<div class="flex items-center gap-2">${logo(m, 26)}<span class="text-sm w-20">${m}</span>
        <input class="inp fa-in" data-a="${m}" type="number" step="0.01" min="0" max="50" placeholder="${s.feePercent}" value="${s.feeByAsset && s.feeByAsset[m] !== undefined ? s.feeByAsset[m] : ''}"><span class="text-sm">%</span></div>`).join('')}</div></div>
    <button onclick="saveSettings()" class="w-full py-3 rounded-xl font-bold text-black" style="background:linear-gradient(135deg,#FFD700,#D4AF37 50%,#B8860B)">Sove</button>
    <p id="st-ok" class="text-emerald-400 text-xs hidden">Sove! Nouvo valè yo aktif touswit.</p></div>`;
}
async function saveSettings() {
  await api('/api/admin/settings', { rate: parseFloat($('st-rate').value), feeActive: $('st-active').classList.contains('on'), feePercent: parseFloat($('st-pct').value) || 0,
    feeByAsset: Object.fromEntries([...document.querySelectorAll('.fa-in')].map((i) => [i.dataset.a, i.value])) });
  $('st-ok').classList.remove('hidden');
}

async function wd(id, status) {
  if (!(await uiConfirm(status === 'done' ? 'Ou voye lajan an deja? Make retrè a kòm peye?' : 'Refize retrè a epi ranbouse kliyan an?', { ok: status === 'done' ? 'Make kòm peye' : 'Refize + ranbouse', danger: status !== 'done' }))) return;
  await api(`/api/admin/withdrawals/${id}/status`, { status });
  load();
}

async function decide(id, decision) {
  let reason = '';
  if (decision === 'rejected' || decision === 'reupload') {
    reason = await uiPrompt('Rezon (opsyonèl, kliyan an ap wè l):', '', { multiline: true, max: 300, ok: 'Voye', danger: true });
    if (reason === null) return false;
  }
  await api(`/api/admin/kyc/${id}/decision`, { decision, reason });
  load();
  return true;
}
let users = [], balUser = null, balCur = 'HTG', balSign = 1;
function openBal(id) {
  balUser = users.find((u) => u.id === id); balCur = 'HTG'; balSign = 1;
  $('b-who').textContent = balUser.name + ' · ' + balUser.email;
  $('b-amount').value = ''; $('b-note').value = ''; $('b-err').classList.add('hidden');
  setBal(); $('m-bal').classList.remove('hidden');
}
function setBal(c, sg) {
  if (c) balCur = c; if (sg) balSign = sg;
  document.querySelectorAll('[data-c]').forEach((b) => b.classList.toggle('on', b.dataset.c === balCur));
  document.querySelectorAll('[data-s]').forEach((b) => b.classList.toggle('on', Number(b.dataset.s) === balSign));
  $('b-cur').textContent = balCur === 'HTG' ? `Balans kounye a: ${Number(balUser.balance).toFixed(2)} HTG` : `Balans kounye a: $${Number(balUser.usd).toFixed(2)}`;
}
async function saveBal() {
  const v = parseFloat($('b-amount').value);
  if (!(v > 0)) { $('b-err').textContent = 'Antre yon montan valid.'; $('b-err').classList.remove('hidden'); return; }
  try {
    await api(`/api/admin/users/${balUser.id}/balance`, { currency: balCur, delta: v * balSign, note: $('b-note').value });
    $('m-bal').classList.add('hidden'); load();
  } catch (e) { $('b-err').textContent = e.message; $('b-err').classList.remove('hidden'); }
}
async function ban(id, banned) {
  if (!(await uiConfirm(banned ? 'Bani kliyan sa a? Li ap ka fè depo sèlman.' : 'Debani kliyan sa a?', { ok: banned ? 'Bani' : 'Debani', danger: !!banned }))) return;
  await api(`/api/admin/users/${id}/ban`, { banned });
  load();
}
async function setRole(id, role) {
  if (!(await uiConfirm(role === 'support' ? 'Bay kont sa a wòl Support? Li ap ka revize dispit P2P ak chat, men PA ka deplase lajan.' : 'Retire wòl Support?'))) return;
  await api(`/api/admin/users/${id}/role`, { role });
  load();
}
async function delUser(id) {
  const u = users.find((x) => x.id === id);
  if (!(await uiConfirm(`Efase kont ${u.name} (${u.email}) NÈT? Done ak dosye KYC li yo ap disparèt. Aksyon sa a pa ka defèt.`, { ok: 'Efase nèt', danger: true }))) return;
  await api(`/api/admin/users/${id}`, null, 'DELETE');
  load();
}

// ---------- Chat support (staff reponn kliyan yo; sèlman tèks) ----------
let chatTimer = null, chatUser = null, chatLast = 0, chatBadgeTimer = null;
function stopChat() { clearInterval(chatTimer); chatTimer = null; chatUser = null; }
const fmtT = (iso) => { try { return new Date(iso).toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch { return ''; } };
async function chatApi(url, body) { // pa montre erè anwo paj la pandan rafrechisman otomatik la
  const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.href = '/'; throw new Error('401'); }
  return { ok: r.ok, status: r.status, d: await r.json().catch(() => ({})) };
}
function setChatBadge(n) { const b = $('chat-badge'); b.textContent = n > 99 ? '99+' : String(n); b.classList.toggle('hidden', !n); }
async function refreshChatBadge() {
  if (document.hidden) return;
  try { const r = await chatApi('/api/admin/support/unread'); if (r.ok) setChatBadge(r.d.unread || 0); } catch { /* pa grav */ }
}

async function loadChat() {
  stopChat();
  const draw = async () => {
    let r; try { r = await chatApi('/api/admin/support/threads'); } catch { return; }
    if (tab !== 'chat' || chatUser) return;
    if (!r.ok) { $('list').innerHTML = '<p class="text-red-400">Pa ka chaje chat la.</p>'; return; }
    setChatBadge(r.d.unread || 0);
    const ts = r.d.threads || [];
    $('list').innerHTML = ts.length ? ts.map((t) => `<button type="button" data-u="${esc(t.userId)}" class="card rounded-2xl p-3 w-full text-left flex gap-3 items-center">
      <div class="min-w-0 flex-1"><p class="font-semibold truncate">${esc(t.name)}${t.banned ? ' <span class="text-red-400 text-[10px]">bani</span>' : ''}</p>
      <p class="text-[11px] text-gray-400 truncate">${esc(t.email)} · ID ${esc(t.uid)}</p>
      <p class="text-xs mt-1 truncate ${t.unread ? 'text-white font-semibold' : 'text-gray-400'}">${t.lastSender === 'staff' ? 'Ou: ' : ''}${esc(t.lastBody)}</p></div>
      <div class="text-right flex-shrink-0"><p class="text-[10px] text-gray-500">${esc(fmtT(t.lastAt))}</p>${t.unread ? `<span class="inline-block mt-1 bg-red-600 text-white rounded-full px-2 py-0.5 text-[10px] font-bold">${t.unread}</span>` : ''}</div></button>`).join('')
      : '<p class="empty">Pa gen mesaj ankò.</p>';
    $('list').querySelectorAll('button[data-u]').forEach((b) => b.addEventListener('click', () => openThread(b.dataset.u)));
  };
  await draw();
  chatTimer = setInterval(() => { if (!document.hidden) draw(); }, 15000);
}

async function openThread(userId) {
  stopChat(); chatUser = userId; chatLast = 0;
  $('list').innerHTML = `<div class="card rounded-2xl overflow-hidden flex flex-col" style="height:calc(100dvh - 11rem);min-height:20rem">
    <div class="p-3 border-b border-white/10 flex items-center gap-3"><button type="button" id="ch-back" class="text-amber-400 text-sm flex-shrink-0">← Retounen</button>
      <div class="min-w-0"><p class="font-semibold truncate" id="ch-name"></p><p class="text-[11px] text-gray-400 truncate" id="ch-sub"></p></div></div>
    <div id="ch-log" class="flex-1 overflow-y-auto p-3 space-y-2" role="log"></div>
    <div id="ch-err" class="text-xs text-red-400 px-3 min-h-[1rem]" role="alert"></div>
    <div class="p-3 border-t border-white/10 flex gap-2 items-end"><textarea id="ch-in" class="inp" rows="2" maxlength="1000" placeholder="Ekri repons ou (sèlman tèks)..."></textarea><button type="button" id="ch-send" class="b on" style="padding:.7rem 1rem">Voye</button></div></div>`;
  $('ch-back').addEventListener('click', () => { stopChat(); loadChat(); });
  const log = $('ch-log'), seen = new Set();
  const add = (m) => {
    if (seen.has(m.id)) return false; seen.add(m.id); if (m.id > chatLast) chatLast = m.id;
    const mine = m.sender === 'staff';
    const b = document.createElement('div');
    b.className = 'max-w-[82%] px-3 py-2 rounded-2xl text-sm whitespace-pre-wrap break-words ' + (mine ? 'ml-auto bg-amber-500 text-black rounded-br-md' : 'bg-white/10 rounded-bl-md');
    b.appendChild(document.createTextNode(m.body)); // textContent: pa gen HTML/XSS
    const s = document.createElement('div'); s.className = 'text-[10px] opacity-60 mt-1'; s.textContent = (mine ? 'Support' : 'Kliyan') + ' · ' + fmtT(m.createdAt);
    b.appendChild(s); log.appendChild(b); return true;
  };
  const pull = async (first) => {
    if (chatUser !== userId || (document.hidden && !first)) return;
    let r; try { r = await chatApi(`/api/admin/support/threads/${encodeURIComponent(userId)}/messages?after=${chatLast}`); } catch { return; }
    if (chatUser !== userId) return;
    if (!r.ok) { if (first) $('ch-err').textContent = r.d.error || 'Pa ka chaje mesaj yo.'; return; }
    if (first) { $('ch-name').textContent = r.d.user.name; $('ch-sub').textContent = `${r.d.user.email} · ID ${r.d.user.uid}`; }
    const near = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    let n = 0; for (const m of r.d.messages) if (add(m)) n++;
    if (first || (n && near)) log.scrollTop = log.scrollHeight;
    if (n) refreshChatBadge();
  };
  let sending = false;
  const send = async () => {
    const body = $('ch-in').value.trim(); if (!body || sending) return;
    sending = true; $('ch-send').disabled = true; $('ch-err').textContent = '';
    try {
      const r = await chatApi(`/api/admin/support/threads/${encodeURIComponent(userId)}/messages`, { body });
      if (!r.ok) { $('ch-err').textContent = r.d.error || 'Pa ka voye.'; return; }
      add(r.d.message); $('ch-in').value = ''; log.scrollTop = log.scrollHeight; refreshChatBadge();
    } catch { $('ch-err').textContent = 'Pa ka voye. Eseye ankò.'; } finally { sending = false; $('ch-send').disabled = false; $('ch-in').focus(); }
  };
  $('ch-send').addEventListener('click', send);
  $('ch-in').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer:coarse)').matches) { e.preventDefault(); send(); } });
  await pull(true);
  chatTimer = setInterval(() => pull(false), 5000);
  $('ch-in').focus();
}

(async () => {
  const r = await fetch('/api/me');
  if (r.status === 401) return (location.href = '/');
  const me = await r.json();
  if (!['admin', 'support'].includes(me.role)) return (location.href = '/');
  window.ME_ROLE = me.role;
  $('role-label').textContent = me.role === 'admin' ? 'Admin Panel' : 'Support Panel';
  refreshChatBadge(); chatBadgeTimer = setInterval(refreshChatBadge, 20000);
  if (me.role === 'support') { // support: sèlman P2P (revizyon dispit) ak Chat kliyan
    document.querySelectorAll('.tab[data-t]').forEach((b) => { if (!['p2p', 'chat'].includes(b.dataset.t)) b.style.display = 'none'; });
    return go('p2p');
  }
  go('kyc');
})();
</script>
