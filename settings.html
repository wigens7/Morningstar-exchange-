<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MORNINGSTAR EXCHANGE - Paramèt</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
body{font-family:'Inter',-apple-system,Roboto,Arial,sans-serif;background:#090a0f;background-image:radial-gradient(circle at 10% 0%,rgba(212,175,55,.09),transparent 45%);min-height:100vh;color:#e5e7eb;padding-bottom:3rem;font-variant-numeric:tabular-nums}
.gold-text{background:linear-gradient(135deg,#FFF099,#F1C40F 35%,#D4AF37 70%,#996515);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.gold-btn{background:linear-gradient(135deg,#FFD700,#D4AF37 50%,#B8860B);color:#000}
.gold-btn:disabled{opacity:.45}
.panel{background:rgba(18,20,29,.78);border:1px solid rgba(255,255,255,.07)}
.sec{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:#9ca3af;font-weight:600;margin:1.4rem 0 .6rem}
.field{display:flex;align-items:center;gap:.5rem;background:rgba(10,11,16,.9);border:1px solid rgba(255,255,255,.14);border-radius:.85rem;padding:0 .85rem;margin-bottom:.7rem}
.field:focus-within{border-color:#D4AF37;box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.field input,.field select{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:.75rem 0;font-size:.9rem}
.field select option{background:#12141d}
.lbl{display:block;font-size:.72rem;color:#d1d5db;font-weight:500;margin-bottom:.3rem}
.lang{border:1px solid rgba(255,255,255,.12);border-radius:.8rem;padding:.65rem .25rem;font-size:.8rem;font-weight:600;color:#9ca3af;transition:all .15s}
.lang.on{border-color:#D4AF37;background:rgba(212,175,55,.12);color:#F1C40F}
.row{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.85rem}
.row:last-child{border:0}
.row span:first-child{color:#9ca3af;flex-shrink:0}.row span:last-child{text-align:right;word-break:break-word}
#toast{position:fixed;top:.75rem;left:.75rem;right:.75rem;max-width:28rem;margin:auto;z-index:70;transition:all .25s}
#toast.hidden{display:block;opacity:0;transform:translateY(-12px);pointer-events:none}
</style>
</head>
<body>
<div id="toast" class="hidden px-4 py-3 rounded-xl text-sm font-medium border"></div>
<div class="max-w-md mx-auto px-4 pt-4">

  <header class="flex items-center gap-3 mb-4">
    <a href="/dashboard.html" class="panel w-9 h-9 rounded-full flex items-center justify-center text-gray-300 text-sm" aria-label="Retounen"><i class="fa-solid fa-arrow-left"></i></a>
    <h1 class="text-lg font-bold gold-text">Paramèt</h1>
  </header>

  <!-- ID -->
  <section class="panel rounded-2xl p-4 flex items-center justify-between gap-3">
    <div class="min-w-0">
      <p class="text-[11px] uppercase tracking-wider text-gray-400">Idantifyan ou</p>
      <p id="uid" class="text-2xl font-bold tracking-[.18em] gold-text">·······</p>
      <p id="who" class="text-xs text-gray-400 truncate mt-0.5"></p>
    </div>
    <button onclick="copy($('uid').textContent)" class="gold-btn px-3.5 py-2 rounded-xl text-xs font-bold flex-shrink-0">Kopye</button>
  </section>

  <!-- Lang -->
  <p class="sec">Lang</p>
  <div class="grid grid-cols-4 gap-2">
    <button class="lang" data-l="ht" onclick="chooseLang('ht')">Kreyòl</button>
    <button class="lang" data-l="fr" onclick="chooseLang('fr')">Français</button>
    <button class="lang" data-l="en" onclick="chooseLang('en')">English</button>
    <button class="lang" data-l="es" onclick="chooseLang('es')">Español</button>
  </div>

  <!-- Enfòmasyon pèsonèl -->
  <p class="sec">Enfòmasyon pèsonèl</p>
  <section id="profile" class="panel rounded-2xl p-4"></section>

  <!-- Sekirite / PIN -->
  <p class="sec">Sekirite</p>
  <section class="panel rounded-2xl p-4">
    <div class="flex items-center justify-between mb-2">
      <p class="font-semibold text-sm">PIN 6 chif</p>
      <span id="pin-state" class="text-[11px] font-semibold px-2 py-0.5 rounded-full"></span>
    </div>
    <p class="text-xs text-gray-400 leading-snug mb-3">Lè PIN lan aktif, ou ka konekte ak PIN lan olye de mòdpas ou, epi chak retrè ap mande PIN lan.</p>
    <div id="pin-form"></div>
  </section>

  <!-- Envitasyon -->
  <p class="sec">Envite lòt moun</p>
  <section class="panel rounded-2xl p-4">
    <p class="text-xs text-gray-400 leading-snug mb-3">Pataje lyen ou a. Moun ki enskri ak li yo konte nan envitasyon ou yo.</p>
    <div class="field"><input id="link" readonly onclick="this.select()"></div>
    <div class="grid grid-cols-2 gap-2">
      <button onclick="copy($('link').value)" class="gold-btn py-2.5 rounded-xl text-xs font-bold">Kopye lyen an</button>
      <button onclick="share()" class="py-2.5 rounded-xl text-xs font-bold border border-white/10 text-gray-200">Pataje</button>
    </div>
    <p id="inv-count" class="text-xs text-gray-400 mt-3"></p>
  </section>

  <!-- KYC + dekonekte -->
  <section class="panel rounded-2xl p-4 mt-4 flex items-center justify-between text-sm">
    <span class="text-gray-400">Verifikasyon idantite</span>
    <span id="kyc" class="text-[11px] font-semibold px-2 py-0.5 rounded-full"></span>
  </section>
  <button onclick="logout()" class="w-full mt-4 py-3.5 rounded-xl border border-white/10 text-sm font-semibold text-gray-200"><i class="fa-solid fa-right-from-bracket mr-2 text-amber-400"></i>Dekonekte</button>
</div>

<script src="/dialogs.js"></script>
<script src="/i18n.js"></script>
<script>
const CODES = 'AD AE AF AG AI AL AM AO AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GT GU GW GY HK HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG US UY UZ VA VC VE VG VI VN VU WF WS YE YT ZA ZM ZW'.split(' ');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, tt;

function toast(msg, ok) {
  const m = $('toast');
  m.className = 'px-4 py-3 rounded-xl text-sm font-medium border ' + (ok ? 'bg-emerald-950 border-emerald-500/40 text-emerald-300' : 'bg-red-950 border-red-500/40 text-red-300');
  m.textContent = msg; clearTimeout(tt); tt = setTimeout(() => m.classList.add('hidden'), 4000);
}
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 401) { location.href = '/'; throw new Error('401'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || t('errGen'));
  return d;
}
async function copy(txt) {
  try { await navigator.clipboard.writeText(txt); } catch { const i = document.createElement('input'); i.value = txt; document.body.appendChild(i); i.select(); document.execCommand('copy'); i.remove(); }
  toast(t('copied'), true);
}
async function share() {
  const url = $('link').value;
  if (navigator.share) { try { await navigator.share({ title: 'Morningstar Exchange', url }); } catch {} } else copy(url);
}
async function logout() { await fetch('/api/logout', { method: 'POST' }); location.href = '/'; }

function countryName(code) {
  try { return new Intl.DisplayNames([{ ht: 'fr', fr: 'fr', en: 'en', es: 'es' }[LANG]], { type: 'region' }).of(code) || code; } catch { return code; }
}

async function chooseLang(l) {
  setLang(l);
  try { await post('/api/lang', { lang: l }); } catch {}
  renderAll();
}

function renderProfile() {
  const p = me.profile, box = $('profile');
  if (p) {
    box.innerHTML = `<p class="text-[11px] text-amber-400 mb-2"><i class="fa-solid fa-lock mr-1"></i>${t('lockedNote')}</p>
      <div class="row"><span>${t('firstName')}</span><span>${esc(p.firstName)}</span></div>
      <div class="row"><span>${t('lastName')}</span><span>${esc(p.lastName)}</span></div>
      <div class="row"><span>${t('dob')}</span><span>${esc(p.dob)}</span></div>
      <div class="row"><span>${t('country')}</span><span>${esc(countryName(p.country))}</span></div>
      <div class="row"><span>${t('phone')}</span><span>${esc(p.phone)}</span></div>
      <div class="row"><span>${t('address')}</span><span>${esc(p.address)}</span></div>`;
    return;
  }
  const d = new Date(); d.setFullYear(d.getFullYear() - 18);
  const max = d.toISOString().slice(0, 10);
  const opts = CODES.map((c) => [c, countryName(c)]).sort((a, b) => a[1].localeCompare(b[1], LANG === 'ht' ? 'fr' : LANG));
  box.innerHTML = `<p class="text-[11px] text-amber-400 mb-3"><i class="fa-solid fa-circle-info mr-1"></i>${t('reqNote')}</p>
    <label class="lbl">${t('firstName')}</label><div class="field"><input id="p-fn" maxlength="50" autocomplete="given-name"></div>
    <label class="lbl">${t('lastName')}</label><div class="field"><input id="p-ln" maxlength="50" autocomplete="family-name"></div>
    <label class="lbl">${t('dob')}</label><div class="field"><input id="p-dob" type="date" min="1900-01-01" max="${max}"></div>
    <label class="lbl">${t('country')}</label><div class="field"><select id="p-co"><option value="">${t('chooseCountry')}</option>${opts.map(([c, n]) => `<option value="${c}">${esc(n)}</option>`).join('')}</select></div>
    <label class="lbl">${t('phone')}</label><div class="field"><input id="p-ph" type="tel" maxlength="20" placeholder="+509 ..." autocomplete="tel"></div>
    <label class="lbl">${t('address')}</label><div class="field"><input id="p-ad" maxlength="200" autocomplete="street-address"></div>
    <button id="p-go" onclick="saveProfile()" class="gold-btn w-full py-3 rounded-xl font-bold text-sm mt-1">${t('saveProfile')}</button>`;
}
async function saveProfile() {
  const body = { firstName: $('p-fn').value, lastName: $('p-ln').value, dob: $('p-dob').value, country: $('p-co').value, phone: $('p-ph').value, address: $('p-ad').value };
  if (Object.values(body).some((v) => !String(v).trim())) return toast(t('errFields'), false);
  if (!(await uiConfirm(t('confirmLock')))) return;
  $('p-go').disabled = true;
  try { me = await post('/api/profile', body); renderProfile(); toast(t('profileSaved'), true); }
  catch (e) { toast(e.message, false); $('p-go') && ($('p-go').disabled = false); }
}

function renderPin() {
  const on = me.pinActive, st = $('pin-state');
  st.textContent = on ? t('pinOn') : t('pinOff');
  st.className = 'text-[11px] font-semibold px-2 py-0.5 rounded-full ' + (on ? 'bg-emerald-500/15 text-emerald-400' : 'bg-white/10 text-gray-400');
  const pw = `<label class="lbl">${t('curPass')}</label><div class="field"><input id="pin-pw" type="password" autocomplete="current-password"></div>`;
  $('pin-form').innerHTML = on
    ? `${pw}<button onclick="pinOff()" class="w-full py-3 rounded-xl border border-red-500/40 text-red-300 text-sm font-semibold">${t('deactivate')}</button>`
    : `<label class="lbl">${t('pinNew')}</label><div class="field"><input id="pin-1" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••"></div>
       <label class="lbl">${t('pinConfirm')}</label><div class="field"><input id="pin-2" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••"></div>
       ${pw}<button onclick="pinOn()" class="gold-btn w-full py-3 rounded-xl font-bold text-sm">${t('activate')}</button>`;
}
async function pinOn() {
  const a = $('pin-1').value, b = $('pin-2').value;
  if (!/^\d{6}$/.test(a)) return toast(t('errPin'), false);
  if (a !== b) return toast(t('pinMismatch'), false);
  try { me = await post('/api/pin/set', { pin: a, password: $('pin-pw').value }); renderPin(); toast(t('pinOk'), true); }
  catch (e) { toast(e.message, false); }
}
async function pinOff() {
  try { me = await post('/api/pin/disable', { password: $('pin-pw').value }); renderPin(); toast(t('pinOffOk'), true); }
  catch (e) { toast(e.message, false); }
}

function renderAll() {
  document.querySelectorAll('.lang').forEach((b) => b.classList.toggle('on', b.dataset.l === LANG));
  $('uid').textContent = me.uid || '·······';
  $('who').textContent = me.name + ' · ' + me.email;
  renderProfile(); renderPin();
  const v = me.kyc.status === 'approved', k = $('kyc');
  k.textContent = v ? t('verified') : t('notVerified');
  k.className = 'text-[11px] font-semibold px-2 py-0.5 rounded-full ' + (v ? 'bg-emerald-500/15 text-emerald-400' : 'bg-amber-500/15 text-amber-400');
}

(async () => {
  const r = await fetch('/api/me');
  if (r.status === 401) return (location.href = '/');
  me = await r.json();
  if (me.role === 'admin' || me.role === 'support') return (location.href = '/admin.html');
  setLang(me.lang || 'ht');
  $('link').value = location.origin + '/?ref=' + me.uid;
  renderAll();
  try {
    const inv = await (await fetch('/api/invites')).json();
    $('inv-count').textContent = t('invited', { n: inv.count });
  } catch {}
})();
</script>
</body>
</html>
